<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detective de Ortografía · 2° Grado · Aula Mágica</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Paleta de 2° Grado (naranja) */
      --grado-arriba: #ffab40;
      --grado-abajo: #fb8c00;
      --grado-borde: #d84315;
      /* Colores de apoyo */
      --verde-arriba: #4ade80;
      --verde-abajo: #22c55e;
      --verde-borde: #15803d;
      --azul-arriba: #38bdf8;
      --azul-abajo: #0284c7;
      --azul-borde: #0369a1;
      --morado-arriba: #5e35b1;
      --morado-abajo: #3949ab;
      --morado-borde: #283593;
      --rojo-arriba: #f87171;
      --rojo-abajo: #ef4444;
      --rojo-borde: #b91c1c;
      --texto: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(180deg, #a9e0ff 0%, #e0f5ff 100%);
      font-family: 'Nunito', sans-serif;
      color: var(--texto);
      min-height: 100vh;
      padding: 20px 14px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .contenedor {
      width: 100%;
      max-width: 840px;
      text-align: center;
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      color: #ffffff;
      background: linear-gradient(180deg, var(--grado-arriba) 0%, var(--grado-abajo) 100%);
      border-bottom: 6px solid var(--grado-borde);
      display: inline-block;
      padding: 12px 30px;
      border-radius: 999px;
      font-size: clamp(1.55rem, 4.8vw, 2.4rem);
      margin-bottom: 20px;
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
      box-shadow: 0 8px 18px rgba(216, 67, 21, 0.22);
    }

    /* Pantallas */
    .pantalla {
      display: none;
    }

    .pantalla.activa {
      display: block;
    }

    /* Tarjeta contenedora */
    .tarjeta-principal {
      background: #ffffff;
      border: 4px solid var(--grado-abajo);
      border-bottom: 8px solid var(--grado-borde);
      border-radius: 26px;
      padding: 24px 18px;
      box-shadow: 0 12px 24px rgba(30, 58, 138, 0.14);
      margin-bottom: 24px;
    }

    .subtitulo {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.1rem, 3.4vw, 1.35rem);
      color: #475569;
      margin-bottom: 20px;
    }

    /* Menú de reglas */
    .grid-reglas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .btn-regla {
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(180deg, var(--grado-arriba) 0%, var(--grado-abajo) 100%);
      border: none;
      border-bottom: 7px solid var(--grado-borde);
      border-radius: 22px;
      padding: 18px 14px;
      color: #ffffff;
      cursor: pointer;
      touch-action: manipulation;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 16px rgba(216, 67, 21, 0.2);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-regla:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px rgba(216, 67, 21, 0.28);
    }

    .btn-regla:active {
      transform: translateY(2px);
    }

    .btn-regla.mezclado {
      background: linear-gradient(180deg, var(--azul-arriba) 0%, var(--azul-abajo) 100%);
      border-bottom-color: var(--azul-borde);
      box-shadow: 0 8px 16px rgba(3, 105, 161, 0.22);
    }

    .regla-titulo {
      font-size: 1.25rem;
      font-weight: 700;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
    }

    .regla-ejemplo {
      background: #ffffff;
      color: #1e293b;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.98rem;
      padding: 6px 14px;
      border-radius: 999px;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.12);
    }

    /* Barra de estado y progreso */
    .barra-estado {
      background: #ffffff;
      border: 3px solid #fed7aa;
      border-bottom: 6px solid #fb923c;
      border-radius: 20px;
      padding: 14px 18px;
      margin-bottom: 18px;
      box-shadow: 0 6px 14px rgba(30, 58, 138, 0.1);
    }

    .datos-estado {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1rem, 3vw, 1.18rem);
      font-weight: 600;
      margin-bottom: 10px;
      color: #334155;
    }

    .badge-regla {
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 14px;
      border-radius: 999px;
      border: 2px solid #38bdf8;
    }

    .badge-puntos {
      background: #fef3c7;
      color: #b45309;
      padding: 4px 14px;
      border-radius: 999px;
      border: 2px solid #f59e0b;
    }

    .progreso-fondo {
      width: 100%;
      height: 18px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.12);
    }

    .progreso-barra {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--grado-arriba) 0%, var(--grado-abajo) 100%);
      transition: width 0.35s ease;
      border-radius: 999px;
    }

    /* Caja de la oración */
    .caja-oracion {
      background: #fff7ed;
      border: 3px solid #fdba74;
      border-radius: 22px;
      padding: 26px 18px;
      margin-bottom: 24px;
      font-size: clamp(1.45rem, 4.8vw, 2.05rem);
      font-weight: 800;
      line-height: 1.5;
      color: #0f172a;
    }

    .hueco {
      display: inline-block;
      min-width: 44px;
      padding: 0 8px;
      margin: 0 2px;
      border-bottom: 5px solid var(--grado-abajo);
      color: var(--grado-borde);
      background: #ffffff;
      border-radius: 10px 10px 4px 4px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .hueco.resuelto {
      background: #dcfce7;
      border-bottom-color: #16a34a;
      color: #15803d;
    }

    /* Botones de opciones (letras) */
    .opciones-letras {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      margin-bottom: 22px;
    }

    .btn-letra {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      color: var(--texto);
      background: #ffffff;
      border: 4px solid #38bdf8;
      border-bottom: 8px solid #0284c7;
      border-radius: 22px;
      min-width: 118px;
      min-height: 78px;
      padding: 12px 24px;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 6px 14px rgba(2, 132, 199, 0.16);
      transition: transform 0.14s ease, background 0.15s ease;
    }

    .btn-letra:hover:not(:disabled) {
      transform: translateY(-4px);
      background: #f0f9ff;
    }

    .btn-letra:active:not(:disabled) {
      transform: translateY(2px);
    }

    .btn-letra.correcta {
      background: linear-gradient(180deg, var(--verde-arriba) 0%, var(--verde-abajo) 100%);
      border-color: var(--verde-abajo);
      border-bottom-color: var(--verde-borde);
      color: #ffffff;
    }

    .btn-letra.incorrecta {
      background: #fee2e2;
      border-color: #f87171;
      border-bottom-color: #dc2626;
      color: #991b1b;
      opacity: 0.7;
    }

    /* Caja de retroalimentación */
    .mensaje-feedback {
      display: none;
      border-radius: 18px;
      padding: 14px 18px;
      margin-bottom: 20px;
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.05rem, 3.2vw, 1.25rem);
      line-height: 1.4;
    }

    .mensaje-feedback.visible {
      display: block;
    }

    .mensaje-feedback.exito {
      background: #dcfce7;
      color: #166534;
      border: 3px solid #4ade80;
    }

    .mensaje-feedback.error {
      background: #fee2e2;
      color: #991b1b;
      border: 3px solid #f87171;
    }

    /* Botones generales 3D */
    .acciones {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .btn-accion, .btn-nav {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(1.05rem, 3.2vw, 1.18rem);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 14px 26px;
      min-height: 52px;
      cursor: pointer;
      touch-action: manipulation;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: transform 0.15s ease;
    }

    .btn-accion:hover, .btn-nav:hover {
      transform: translateY(-3px);
    }

    .btn-accion:active, .btn-nav:active {
      transform: translateY(2px);
    }

    .btn-siguiente {
      background: linear-gradient(180deg, var(--azul-arriba) 0%, var(--azul-abajo) 100%);
      border-bottom: 6px solid var(--azul-borde);
      box-shadow: 0 8px 16px rgba(3, 105, 161, 0.24);
    }

    .btn-verde {
      background: linear-gradient(180deg, var(--verde-arriba) 0%, var(--verde-abajo) 100%);
      border-bottom: 6px solid var(--verde-borde);
      box-shadow: 0 8px 16px rgba(21, 128, 61, 0.24);
    }

    .btn-gris {
      background: linear-gradient(180deg, #94a3b8 0%, #64748b 100%);
      border-bottom: 6px solid #475569;
      box-shadow: 0 6px 12px rgba(71, 85, 105, 0.22);
    }

    /* Pantalla final */
    .pantalla-final h2 {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.6rem, 5vw, 2.3rem);
      color: #ea580c;
      margin: 12px 0 14px;
    }

    .caja-calificacion {
      display: inline-block;
      background: #fff7ed;
      border: 4px solid var(--grado-abajo);
      border-bottom: 7px solid var(--grado-borde);
      border-radius: 22px;
      padding: 16px 32px;
      margin-bottom: 18px;
      box-shadow: 0 8px 16px rgba(216, 67, 21, 0.14);
    }

    .etiqueta-calificacion {
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      color: #9a3412;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .numero-calificacion {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      font-weight: 700;
      line-height: 1.1;
    }

    .resumen-final {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.1rem, 3.5vw, 1.35rem);
      color: #334155;
      margin-bottom: 24px;
    }

    /* Botones de navegación inferior */
    .navegacion {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 8px;
    }

    .btn-menu-grado {
      background: linear-gradient(180deg, var(--grado-arriba) 0%, var(--grado-abajo) 100%);
      border-bottom: 6px solid var(--grado-borde);
      box-shadow: 0 8px 16px rgba(216, 67, 21, 0.24);
    }

    .btn-aula-magica {
      background: linear-gradient(180deg, var(--morado-arriba) 0%, var(--morado-abajo) 100%);
      border-bottom: 6px solid var(--morado-borde);
      box-shadow: 0 8px 16px rgba(40, 53, 147, 0.28);
    }

    @media (max-width: 600px) {
      .tarjeta-principal {
        padding: 18px 12px;
      }

      .grid-reglas {
        grid-template-columns: 1fr;
      }

      .btn-letra {
        min-width: 104px;
        min-height: 70px;
      }

      .acciones .btn-accion,
      .navegacion .btn-nav {
        width: 100%;
        max-width: 340px;
      }
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <h1>Detective de Ortografía</h1>

    <!-- PANTALLA 1: MENÚ DE REGLAS -->
    <div id="pantalla-menu" class="pantalla activa">
      <div class="tarjeta-principal">
        <p class="subtitulo">Elige la regla que quieres practicar hoy:</p>

        <div class="grid-reglas">
          <button class="btn-regla" onclick="iniciarModo('r_rr')">
            <span class="regla-titulo">R suave y RR fuerte</span>
            <span class="regla-ejemplo">pe__o · ma__iposa</span>
          </button>

          <button class="btn-regla" onclick="iniciarModo('mayusculas')">
            <span class="regla-titulo">Mayúsculas y minúsculas</span>
            <span class="regla-ejemplo">M / m · P / p</span>
          </button>

          <button class="btn-regla" onclick="iniciarModo('c_qu')">
            <span class="regla-titulo">Uso de C y QU</span>
            <span class="regla-ejemplo">__asa · __eso</span>
          </button>

          <button class="btn-regla" onclick="iniciarModo('mp_mb')">
            <span class="regla-titulo">M antes de P y B</span>
            <span class="regla-ejemplo">ca__pana · ta__bor</span>
          </button>

          <button class="btn-regla" onclick="iniciarModo('b_v')">
            <span class="regla-titulo">Uso de B y V</span>
            <span class="regla-ejemplo">__arco · __aca</span>
          </button>

          <button class="btn-regla mezclado" onclick="iniciarModo('mezclado')">
            <span class="regla-titulo">Reto Mezclado</span>
            <span class="regla-ejemplo">Todas las reglas</span>
          </button>
        </div>
      </div>
    </div>

    <!-- PANTALLA 2: JUEGO -->
    <div id="pantalla-juego" class="pantalla">
      <div class="barra-estado">
        <div class="datos-estado">
          <span id="texto-contador">Pregunta 1 de 10</span>
          <span class="badge-regla" id="texto-modo">Regla</span>
          <span class="badge-puntos" id="texto-aciertos">Aciertos: 0</span>
        </div>
        <div class="progreso-fondo">
          <div class="progreso-barra" id="progreso-barra"></div>
        </div>
      </div>

      <div class="tarjeta-principal">
        <p class="subtitulo">Toca la letra correcta para completar la palabra:</p>

        <div class="caja-oracion" id="caja-oracion"></div>

        <div class="opciones-letras" id="opciones-letras"></div>

        <div class="mensaje-feedback" id="mensaje-feedback"></div>

        <div class="acciones">
          <button class="btn-accion btn-gris" onclick="volverAlMenuReglas()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Cambiar de regla
          </button>

          <button class="btn-accion btn-siguiente" id="btn-siguiente" onclick="siguientePregunta()" style="display: none;">
            Siguiente
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- PANTALLA 3: RESULTADO FINAL -->
    <div id="pantalla-final" class="pantalla pantalla-final">
      <div class="tarjeta-principal">
        <svg width="78" height="78" viewBox="0 0 24 24" fill="#fbbf24" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
          <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
          <path d="M4 22h16"></path>
          <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
          <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
          <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
        </svg>

        <h2>¡Caso resuelto!</h2>

        <div class="caja-calificacion">
          <div class="etiqueta-calificacion">Calificación final</div>
          <div class="numero-calificacion" id="numero-calificacion">10.0</div>
        </div>

        <p class="resumen-final" id="resumen-final"></p>

        <div class="acciones">
          <button class="btn-accion btn-verde" onclick="iniciarModo(modoActual)">
            Jugar otra vez
          </button>
          <button class="btn-accion btn-siguiente" onclick="volverAlMenuReglas()">
            Elegir otra regla
          </button>
        </div>
      </div>
    </div>

    <!-- Botones de navegación inferior -->
    <div class="navegacion">
      <a class="btn-nav btn-menu-grado" href="../lenguajes.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Regresar a Menú
      </a>

      <a class="btn-nav btn-aula-magica" href="../../../index.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5L12 3l9 7.5"></path>
          <path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"></path>
        </svg>
        Regresar a Aula Mágica
      </a>
    </div>
  </div>

  <script>
    const NOMBRES_MODOS = {
      r_rr: "R y RR",
      mayusculas: "Mayúsculas",
      c_qu: "C y QU",
      mp_mb: "M antes de P y B",
      b_v: "B y V",
      mezclado: "Reto Mezclado"
    };

    // =========================================================================
    // BANCO DE PREGUNTAS (50 oraciones simples: 10 por cada regla)
    // INSTRUCCIÓN: Usa "___" (tres guiones bajos) donde va la letra faltante.
    // Puedes agregar más reactivos dentro de cualquier regla siguiendo el modelo.
    // =========================================================================
    const bancoPreguntas = {

        { oracion: "Luis tiene una ca___a feliz.", opciones: ["r", "rr"], correcta: "r", pista: "Suena suave, se escribe con una r." },
        { oracion: "El bu___o camina despacio.", opciones: ["r", "rr"], correcta: "rr", pista: "Suena fuerte entre vocales, lleva rr." },
        { oracion: "El to___o está en el campo.", opciones: ["r", "rr"], correcta: "r", pista: "Suena suave, se escribe con una r." },
        { oracion: "El zo___o corre en el bosque.", opciones: ["r", "rr"], correcta: "rr", pista: "Entre vocales suena fuerte con rr." },
        { oracion: "La a___aña teje su red.", opciones: ["r", "rr"], correcta: "r", pista: "Suena suave, se escribe con una r." },
        { oracion: "Mi hermana toca la guita___a.", opciones: ["r", "rr"], correcta: "rr", pista: "Entre vocales suena fuerte con rr." },
        { oracion: "El ca___acol lleva su casa.", opciones: ["r", "rr"], correcta: "r", pista: "Suena suave, se escribe con una r." },
        { oracion: "Mamá sirve agua en la ja___a.", opciones: ["r", "rr"], correcta: "rr", pista: "Entre vocales suena fuerte con rr." },
        { oracion: "La si___ena nada en el mar.", opciones: ["r", "rr"], correcta: "r", pista: "Suena suave, se escribe con una r." },
        { oracion: "El tren pasa por la tie___a.", opciones: ["r", "rr"], correcta: "rr", pista: "Entre vocales suena fuerte con rr." },
        { oracion: "El paja___ito canta muy bonito.", opciones: ["r", "rr"], correcta: "r", pista: "Suena suave, se escribe con una r." },
        { oracion: "El niño jala la ca___eta.", opciones: ["r", "rr"], correcta: "rr", pista: "Entre vocales suena fuerte con rr." },
        { oracion: "El pirata busca el teso___o.", opciones: ["r", "rr"], correcta: "r", pista: "Suena suave, se escribe con una r." }

    const TOTAL_RONDAS = 10;
    const bolsasPorModo = {};
    let modoActual = 'mezclado';
    let preguntasPartida = [];
    let indiceActual = 0;
    let aciertos = 0;
    let yaFalloEnEsta = false;
    let bloqueado = false;

    function mezclarArreglo(arr) {
      const copia = [...arr];
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      return copia;
    }

    function obtenerBancoCompleto(modo) {
      if (modo === 'mezclado') {
        return [
          ...bancoPreguntas.r_rr,
          ...bancoPreguntas.mayusculas,
          ...bancoPreguntas.c_qu,
          ...bancoPreguntas.mp_mb,
          ...bancoPreguntas.b_v
        ];
      }
      return bancoPreguntas[modo] || [];
    }

    function obtenerPreguntasSinRepetir(modo, cantidad) {
      const base = obtenerBancoCompleto(modo);
      const limite = Math.min(cantidad, base.length);
      const seleccion = [];

      if (!bolsasPorModo[modo]) {
        bolsasPorModo[modo] = [];
      }

      while (seleccion.length < limite) {
        if (bolsasPorModo[modo].length === 0) {
          bolsasPorModo[modo] = mezclarArreglo(base);
        }
        const candidata = bolsasPorModo[modo].pop();
        if (!seleccion.includes(candidata)) {
          seleccion.push(candidata);
        }
      }
      return seleccion;
    }

    function mostrarPantalla(id) {
      document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
      document.getElementById(id).classList.add('activa');
      window.scrollTo(0, 0);
    }

    function volverAlMenuReglas() {
      mostrarPantalla('pantalla-menu');
    }

    function iniciarModo(modo) {
      modoActual = modo;
      preguntasPartida = obtenerPreguntasSinRepetir(modo, TOTAL_RONDAS);
      indiceActual = 0;
      aciertos = 0;

      document.getElementById('texto-modo').textContent = NOMBRES_MODOS[modo] || 'Ortografía';
      mostrarPantalla('pantalla-juego');
      cargarPregunta();
    }

    function cargarPregunta() {
      const item = preguntasPartida[indiceActual];
      yaFalloEnEsta = false;
      bloqueado = false;

      // Actualizar estado y barra
      document.getElementById('texto-contador').textContent = `Pregunta ${indiceActual + 1} de ${preguntasPartida.length}`;
      document.getElementById('texto-aciertos').textContent = `Aciertos: ${aciertos}`;
      const porcentaje = (indiceActual / preguntasPartida.length) * 100;
      document.getElementById('progreso-barra').style.width = `${porcentaje}%`;

      // Pintar oración con hueco
      const oracionHTML = item.oracion.replace('___', '<span class="hueco" id="hueco-letra">?</span>');
      document.getElementById('caja-oracion').innerHTML = oracionHTML;

      // Pintar botones de opciones
      const contOpciones = document.getElementById('opciones-letras');
      contOpciones.innerHTML = '';
      item.opciones.forEach(opcion => {
        const btn = document.createElement('button');
        btn.className = 'btn-letra';
        btn.textContent = opcion;
        btn.onclick = () => elegirOpcion(opcion, btn);
        contOpciones.appendChild(btn);
      });

      ocultarFeedback();
      document.getElementById('btn-siguiente').style.display = 'none';
    }

    function elegirOpcion(opcion, boton) {
      if (bloqueado) return;
      const item = preguntasPartida[indiceActual];
      const hueco = document.getElementById('hueco-letra');

      if (opcion === item.correcta) {
        bloqueado = true;
        if (!yaFalloEnEsta) {
          aciertos++;
        }

        boton.classList.add('correcta');
        document.querySelectorAll('.btn-letra').forEach(b => b.disabled = true);

        hueco.textContent = item.correcta;
        hueco.classList.add('resuelto');

        document.getElementById('texto-aciertos').textContent = `Aciertos: ${aciertos}`;
        const porcentaje = ((indiceActual + 1) / preguntasPartida.length) * 100;
        document.getElementById('progreso-barra').style.width = `${porcentaje}%`;

        mostrarFeedback('exito', `¡Muy bien! ${item.pista}`);
        document.getElementById('btn-siguiente').style.display = 'inline-flex';
      } else {
        yaFalloEnEsta = true;
        boton.classList.add('incorrecta');
        boton.disabled = true;
        mostrarFeedback('error', `Casi. Pista: ${item.pista} Intenta con otra opción.`);
      }
    }

    function siguientePregunta() {
      indiceActual++;
      if (indiceActual >= preguntasPartida.length) {
        mostrarPantallaFinal();
      } else {
        cargarPregunta();
      }
    }

    function mostrarPantallaFinal() {
      const total = preguntasPartida.length;
      const calificacion = (aciertos / total) * 10;
      const numEl = document.getElementById('numero-calificacion');

      numEl.textContent = calificacion.toFixed(1);
      if (calificacion >= 8) {
        numEl.style.color = '#15803d';
      } else if (calificacion >= 6) {
        numEl.style.color = '#d97706';
      } else {
        numEl.style.color = '#dc2626';
      }

      let mensaje = '';
      if (aciertos === total) {
        mensaje = `¡Excelente detective! Lograste ${aciertos} de ${total} aciertos a la primera.`;
      } else if (aciertos >= 7) {
        mensaje = `¡Muy bien! Lograste ${aciertos} de ${total} aciertos a la primera.`;
      } else {
        mensaje = `Lograste ${aciertos} de ${total} aciertos a la primera. ¡Sigue practicando!`;
      }

      document.getElementById('resumen-final').textContent = mensaje;
      mostrarPantalla('pantalla-final');
    }

    function mostrarFeedback(tipo, texto) {
      const box = document.getElementById('mensaje-feedback');
      box.className = `mensaje-feedback visible ${tipo}`;
      box.textContent = texto;
    }

    function ocultarFeedback() {
      const box = document.getElementById('mensaje-feedback');
      box.className = 'mensaje-feedback';
      box.textContent = '';
    }
