<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Matemáticas 4to</title>

  <style>
    body {
      background-color: #bce6ff;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: 'Fredoka', sans-serif; /* Asegurando que se use la fuente Fredoka */
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #ff6347;
      font-size: 3em;
      margin-bottom: 30px;
      text-shadow: 2px 2px #fff;
    }

    .enlaces {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
    }

    .card {
      background-color: #ffffff;
      border: 4px solid #0284c7;
      border-bottom: 8px solid #0369a1;
      border-radius: 20px;
      padding: 10px;
      width: 220px;
      transition: transform 0.3s ease;
      box-shadow: 0 8px 16px rgba(30, 58, 138, 0.15);
      text-decoration: none;
    }

    .card:hover {
      transform: scale(1.05);
      cursor: pointer;
    }

    .card img {
      width: 200px;
      height: auto;
      border-radius: 15px;
    }

    .titulo {
      margin-top: 10px;
      font-size: 1.2em;
      color: #333;
    }

    footer {
      margin-top: 50px;
      font-size: 0.9em;
      color: #666;
    }

    @media (max-width: 600px) {
      body {
        font-family: 'Fredoka', sans-serif;
        font-size: 1.2em;
      }
      .card img {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>
<body>

  <h1>Matemáticas 4to</h1>

  <div class="enlaces">
    <!-- Problemas Razonados -->
    <a href="problemasrazonados/problemas_razonados4.html" class="card">

      <div class="titulo">Problemas Razonados</div>
    </a>

    <!-- 🧐 Sumas, Restas y Multiplicaciones 🧐-->
    <a href="matematicas/matematicas.html" class="card">
      <img src="imagenes/matematicas.png" alt="Sumas, Restas y Multiplicaciones">
      <div class="titulo">Sumas, Restas, Multiplicaciones, Divisiones</div>
    </a>

    <!--  Identificar Fracciones -->
    <a href="Idfracciones/identificador_de_fracciones.html" class="card">
      <img src="imagenes/idfracciones.png" alt="Sumas, Restas y Multiplicaciones">
      <div class="titulo">Identificar Fracciones</div>
    </a>
 
   <!--  Suma y Resta de Fracciones -->
    <a href="fracciones/suma_y_resta_de_fracciones.html" class="card">
      <img src="imagenes/fracciones.png" alt="Suma y Resta de Fracciones">
      <div class="titulo">Suma y Resta de Fracciones</div>
    </a>

    <!-- 🧐 Mayor, Menor, Igual 🧐-->
    <a href="mayormenor/mayormenor.html" class="card">
      <img src="imagenes/mayormenor.png" alt="Sumas y Restas de Pociones">
      <div class="titulo">Mayor, Menor, Igual</div>
    </a>

  </div>

  <footer>
    © 2025 Matemáticas 4to · Página de inicio
  </footer>

  <div style="margin-top: 2em;">
    <a href="../../index.html" style="
      background-color: #4A148C;
      color: white;
      padding: 0.7em 1.5em;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1em;
      display: inline-block;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    " onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
      ⬅️ Regresar a Menú Principal
    </a>
  </div>

</body>
</html>
