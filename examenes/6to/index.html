<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Tam Aprende 6to año · Aula Mágica</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-fondo-arriba: #a9e0ff;
            --color-fondo-abajo: #e0f5ff;
            /* Colores de 6° Grado (rosa) */
            --color-grado-arriba: #f472b6;
            --color-grado-abajo: #db2777;
            --color-grado-borde: #9d174d;
            /* Colores de botones de acción */
            --color-verde-arriba: #4ade80;
            --color-verde-abajo: #22c55e;
            --color-verde-borde: #15803d;
            --color-azul-arriba: #38bdf8;
            --color-azul-abajo: #0284c7;
            --color-azul-borde: #0369a1;
            --color-naranja-arriba: #ffab40;
            --color-naranja-abajo: #fb8c00;
            --color-naranja-borde: #d84315;
            --color-morado-arriba: #5e35b1;
            --color-morado-abajo: #3949ab;
            --color-morado-borde: #283593;
            --color-texto: #1e293b;
            --color-tarjeta: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(180deg, var(--color-fondo-arriba) 0%, var(--color-fondo-abajo) 100%);
            color: var(--color-texto);
            margin: 0;
            padding: 24px 16px 40px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        /* Sistema de Pantallas */
        .pantalla {
            display: none;
            width: 100%;
            max-width: 860px;
            text-align: center;
            animation: fadeIn 0.35s ease;
        }

        .pantalla.activa {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            color: #ffffff;
            background: linear-gradient(180deg, var(--color-grado-arriba) 0%, var(--color-grado-abajo) 100%);
            border-bottom: 6px solid var(--color-grado-borde);
            display: inline-block;
            padding: 12px 32px;
            border-radius: 999px;
            font-size: clamp(1.6rem, 4.8vw, 2.5rem);
            margin: 0 0 18px;
            text-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
            box-shadow: 0 8px 18px rgba(157, 23, 77, 0.22);
        }

        h2 {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(1.35rem, 3.8vw, 1.85rem);
            color: #1e293b;
            margin: 0 0 14px;
        }

        .instruccion {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            color: #334155;
            margin: 0 0 26px;
        }

        /* Tarjetas de Examen (Pantalla Inicio) */
        .contenedor-examenes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 300px));
            justify-content: center;
            gap: 24px;
            margin: 0 auto;
        }

        .tarjeta-examen {
            background: linear-gradient(180deg, var(--color-grado-arriba) 0%, var(--color-grado-abajo) 100%);
            border-bottom: 8px solid var(--color-grado-borde);
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 10px 18px rgba(157, 23, 77, 0.22);
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .tarjeta-examen:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 24px rgba(157, 23, 77, 0.3);
        }

        .tarjeta-examen:active {
            transform: translateY(2px);
            box-shadow: 0 4px 10px rgba(157, 23, 77, 0.22);
        }

        .tarjeta-examen img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: contain;
            padding: 6px;
            background: #ffffff;
            border-radius: 16px;
            border: 3px solid rgba(255, 255, 255, 0.85);
            display: block;
        }

        .tarjeta-examen h2 {
            background: #ffffff;
            color: #1e293b;
            font-size: 1.35rem;
            margin: 0;
            padding: 12px 14px;
            border-radius: 18px;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.16);
        }

        /* Botones de Bloques */
        .contenedor-bloques {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        /* Estilos de Cuestionario */
        #titulo-cuestionario {
            background: linear-gradient(180deg, var(--color-azul-arriba) 0%, var(--color-azul-abajo) 100%);
            border-bottom: 5px solid var(--color-azul-borde);
            color: #ffffff;
            display: inline-block;
            padding: 10px 26px;
            border-radius: 999px;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
            margin-bottom: 18px;
        }

        .pregunta-card {
            background: var(--color-tarjeta);
            border: 3px solid #cbd5e1;
            border-bottom: 6px solid #94a3b8;
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 22px;
            box-shadow: 0 6px 14px rgba(30, 58, 138, 0.1);
            text-align: left;
        }

        .imagen-pregunta {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 0 auto 16px;
            display: block;
        }

        .texto-pregunta {
            font-size: 1.22rem;
            font-weight: 800;
            margin-bottom: 16px;
            line-height: 1.4;
            color: #0f172a;
        }

        /* Opciones en 2 columnas */
        .opciones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 14px;
        }

        .opcion-label {
            background: #f8fafc;
            padding: 14px 16px;
            border-radius: 14px;
            border: 2px solid #cbd5e1;
            cursor: pointer;
            font-size: 1.08rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            transition: background 0.18s ease, border-color 0.18s ease;
        }

        .opcion-label:hover {
            background: #e0f2fe;
            border-color: #38bdf8;
        }

        .opcion-label input {
            margin-right: 14px;
            transform: scale(1.4);
            flex-shrink: 0;
            accent-color: #0284c7;
        }

        /* Correcciones visuales al calificar */
        .opcion-correcta {
            background-color: #dcfce7 !important;
            border-color: #16a34a !important;
            color: #14532d;
        }

        .opcion-incorrecta {
            background-color: #fee2e2 !important;
            border-color: #dc2626 !important;
            color: #7f1d1d;
        }

        /* Respuestas con imagen */
        .imagen-opcion-respuesta {
            max-width: 150px;
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-left: 8px;
            vertical-align: middle;
        }

        /* Panel flotante de progreso */
        #panel-progreso-flotante {
            position: sticky;
            top: 0;
            background: rgba(224, 245, 255, 0.96);
            backdrop-filter: blur(6px);
            padding: 14px 16px 12px;
            z-index: 100;
            border-radius: 18px;
            border: 2px solid #bae6fd;
            box-shadow: 0 6px 14px rgba(30, 58, 138, 0.12);
            margin-bottom: 22px;
        }

        #contenedor-progreso {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 999px;
            margin-bottom: 6px;
            height: 20px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15);
        }

        #barra-progreso {
            height: 100%;
            background: linear-gradient(90deg, #4ade80 0%, #22c55e 100%);
            width: 0%;
            transition: width 0.35s ease;
        }

        #texto-progreso {
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            color: #334155;
            margin: 0;
            font-weight: 600;
        }

        /* Botones Generales 3D */
        button, .btn-regresar {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            border: none;
            border-radius: 999px;
            padding: 14px 26px;
            font-size: 1.15rem;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        button:hover, .btn-regresar:hover {
            transform: translateY(-3px);
        }

        button:active, .btn-regresar:active {
            transform: translateY(2px);
        }

        .btn-bloque {
            background: linear-gradient(180deg, var(--color-azul-arriba) 0%, var(--color-azul-abajo) 100%);
            color: #ffffff;
            border-bottom: 6px solid var(--color-azul-borde);
            border-radius: 20px;
            padding: 16px 14px;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 8px 16px rgba(3, 105, 161, 0.22);
            margin: 0;
        }

        .btn-primario {
            background: linear-gradient(180deg, var(--color-verde-arriba) 0%, var(--color-verde-abajo) 100%);
            color: #ffffff;
            border-bottom: 6px solid var(--color-verde-borde);
            box-shadow: 0 8px 16px rgba(21, 128, 61, 0.25);
            width: 100%;
            max-width: 320px;
            margin: 12px auto;
        }

        .btn-secundario {
            background: linear-gradient(180deg, var(--color-naranja-arriba) 0%, var(--color-naranja-abajo) 100%);
            color: #ffffff;
            border-bottom: 6px solid var(--color-naranja-borde);
            box-shadow: 0 8px 16px rgba(216, 67, 21, 0.24);
            margin: 8px;
        }

        .btn-regresar {
            background: linear-gradient(180deg, var(--color-morado-arriba) 0%, var(--color-morado-abajo) 100%);
            color: #ffffff;
            border-bottom: 6px solid var(--color-morado-borde);
            box-shadow: 0 8px 16px rgba(40, 53, 147, 0.28);
        }

        #zona-resultados {
            margin-top: 28px;
            padding: 24px 16px;
            background: #ffffff;
            border: 3px solid #22c55e;
            border-bottom: 7px solid #15803d;
            border-radius: 24px;
            box-shadow: 0 10px 20px rgba(21, 128, 61, 0.16);
        }

        .botones-finales {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }

        .botones-finales .btn-primario {
            width: auto;
            margin: 8px;
        }

        /* Ajustes para celular */
        @media (max-width: 600px) {
            body {
                padding: 16px 12px 32px;
            }

            .contenedor-examenes {
                grid-template-columns: 1fr;
                max-width: 360px;
            }

            .opciones {
                grid-template-columns: 1fr;
            }

            .pregunta-card {
                padding: 16px;
            }

            .texto-pregunta {
                font-size: 1.1rem;
            }

            .opcion-label {
                font-size: 1rem;
                padding: 12px;
            }

            .btn-regresar, .btn-secundario, .botones-finales .btn-primario {
                width: 100%;
                max-width: 340px;
                margin: 6px auto;
            }
        }
    </style>
</head>
<body>

    <div id="pantalla-inicio" class="pantalla activa">
        <h1>Examen Tam Aprende 6to año</h1>
        <p class="instruccion">Selecciona el examen que deseas contestar:</p>
        <div class="contenedor-examenes">
            <div class="tarjeta-examen" onclick="seleccionarExamen('K')">
                <img src="imagenes/examen_k.png" alt="Examen K">
                <h2>Examen K</h2>
            </div>
            <div class="tarjeta-examen" onclick="seleccionarExamen('L')">
                <img src="imagenes/examen_l.png" alt="Examen L">
                <h2>Examen L</h2>
            </div>
        </div>

        <div style="margin-top: 38px;">
            <a href="../../index.html" class="btn-regresar">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Regresar al Menú Principal
            </a>
        </div>
    </div>

    <div id="pantalla-bloques" class="pantalla">
        <h1 id="titulo-bloques">Bloques del Examen</h1>
        <p class="instruccion">Selecciona el bloque de preguntas:</p>
        <div class="contenedor-bloques" id="lista-bloques"></div>
        <button class="btn-secundario" onclick="mostrarPantalla('pantalla-inicio')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Regresar al Inicio
        </button>
    </div>

    <div id="pantalla-preguntas" class="pantalla">
        <h2 id="titulo-cuestionario">Bloque de Preguntas</h2>

        <div id="panel-progreso-flotante">
            <div id="contenedor-progreso">
                <div id="barra-progreso"></div>
            </div>
            <p id="texto-progreso">0 de X respondidas</p>
        </div>

        <div id="contenedor-preguntas"></div>

        <button id="btn-calificar" class="btn-primario" onclick="calificarExamen()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Calificar
        </button>

        <div id="zona-resultados" style="display: none;">
            <h2 id="texto-calificacion"></h2>
            <div class="botones-finales">
                <button class="btn-secundario" onclick="mostrarPantalla('pantalla-bloques')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Elegir otro bloque
                </button>
                <button id="btn-siguiente-bloque" class="btn-primario" onclick="siguienteBloque()">
                    Siguiente Bloque
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </div>

        // Generar los bloques de opciones
        const generarBotonesBloques = () => {
            const contenedor = document.getElementById('lista-bloques');
            contenedor.innerHTML = '';

            let numeroPreguntaInicio = 1;
            const bloques = Object.keys(baseDeDatos[examenActual]).sort((a, b) => a - b);

            bloques.forEach((bloqueId) => {
                const cantidadPreguntas = baseDeDatos[examenActual][bloqueId].length;

                if (cantidadPreguntas > 0) {
                    const numeroPreguntaFin = numeroPreguntaInicio + cantidadPreguntas - 1;

                    let nombreMateria = "Evaluación";
                    if (materiasPorBloque[examenActual] && materiasPorBloque[examenActual][bloqueId]) {
                        nombreMateria = materiasPorBloque[examenActual][bloqueId];
                    }

                    const btn = document.createElement('button');
                    btn.className = 'btn-bloque';
                    btn.innerHTML = `
                        <strong style="font-size: 1.15em; display: block;">${nombreMateria}</strong>
                        <span style="font-size: 0.95em; opacity: 0.95;">Opción ${bloqueId}: Preguntas ${numeroPreguntaInicio} - ${numeroPreguntaFin}</span>
                    `;

                    btn.onclick = () => iniciarCuestionario(parseInt(bloqueId));
                    contenedor.appendChild(btn);

                    numeroPreguntaInicio = numeroPreguntaFin + 1;
                }
            });
        };

        // Navegación entre pantallas
        const mostrarPantalla = (idPantalla) => {
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
            document.getElementById(idPantalla).classList.add('activa');
            window.scrollTo(0, 0);
        };

        const seleccionarExamen = (tipo) => {
            examenActual = tipo;
            document.getElementById('titulo-bloques').textContent = `Bloques del Examen ${tipo}`;
            generarBotonesBloques();
            mostrarPantalla('pantalla-bloques');
        };

        const iniciarCuestionario = (bloque) => {
            bloqueActual = bloque;

            if (!baseDeDatos[examenActual][bloqueActual] || baseDeDatos[examenActual][bloqueActual].length === 0) {
                alert("Aún no has capturado las preguntas para este bloque en el código.");
                return;
            }

            const nombreMateria = (materiasPorBloque[examenActual] && materiasPorBloque[examenActual][bloqueActual])
                ? materiasPorBloque[examenActual][bloqueActual]
                : `Bloque ${bloqueActual}`;
            document.getElementById('titulo-cuestionario').textContent = `Examen ${examenActual} · Bloque ${bloqueActual} (${nombreMateria})`;

            construirPreguntasHTML();
            actualizarProgreso();

            document.getElementById('btn-calificar').style.display = 'inline-flex';
            document.getElementById('zona-resultados').style.display = 'none';
            mostrarPantalla('pantalla-preguntas');
        };

        const construirPreguntasHTML = () => {
            const contenedor = document.getElementById('contenedor-preguntas');
            contenedor.innerHTML = '';

            const preguntas = baseDeDatos[examenActual][bloqueActual];

            let numeroPreguntaGlobal = 1;
            const bloques = Object.keys(baseDeDatos[examenActual]).sort((a, b) => a - b);
            for (let i = 0; i < bloques.length; i++) {
                const bId = parseInt(bloques[i]);
                if (bId < bloqueActual) {
                    numeroPreguntaGlobal += baseDeDatos[examenActual][bId].length;
                } else {
                    break;
                }
            }

            preguntas.forEach((item, index) => {
                const divPregunta = document.createElement('div');
                divPregunta.className = 'pregunta-card';

                let htmlImagen = '';
                if (item.imagen !== "") {
                    htmlImagen = `<img src="${item.imagen}" class="imagen-pregunta" alt="Imagen de apoyo">`;
                }

                let htmlOpciones = '<div class="opciones">';
                item.opciones.forEach((opcion, i) => {
                    let contenidoOpcion = opcion;
                    const opcionMinusculas = opcion.toLowerCase();

                    if (opcionMinusculas.endsWith('.png') || opcionMinusculas.endsWith('.jpg') || opcionMinusculas.endsWith('.jpeg')) {
                        contenidoOpcion = `<img src="${opcion}" class="imagen-opcion-respuesta" alt="Opción visual">`;
                    }

                    htmlOpciones += `
                        <label class="opcion-label" id="label-p${index}-o${i}">
                            <input type="radio" name="pregunta${index}" value="${i}" onchange="actualizarProgreso()">
                            <span>${contenidoOpcion}</span>
                        </label>
                    `;
                });
                htmlOpciones += '</div>';

                const posicion = item.posicionImagen || 'arriba';

                if (posicion === 'arriba') {
                    divPregunta.innerHTML = `
                        ${htmlImagen}
                        <div class="texto-pregunta">${numeroPreguntaGlobal + index}. ${item.pregunta}</div>
                        ${htmlOpciones}
                    `;
                } else {
                    divPregunta.innerHTML = `
                        <div class="texto-pregunta">${numeroPreguntaGlobal + index}. ${item.pregunta}</div>
                        ${htmlImagen}
                        ${htmlOpciones}
                    `;
                }

                contenedor.appendChild(divPregunta);
            });
        };

        const calificarExamen = () => {
            const preguntas = baseDeDatos[examenActual][bloqueActual];
            let aciertos = 0;
            let todasRespondidas = true;

            preguntas.forEach((item, index) => {
                const opcionesRadio = document.getElementsByName(`pregunta${index}`);
                let respondida = false;
                let valorSeleccionado = null;

                opcionesRadio.forEach(radio => {
                    radio.disabled = true;
                    if (radio.checked) {
                        respondida = true;
                        valorSeleccionado = parseInt(radio.value);
                    }
                });

                if (!respondida) {
                    todasRespondidas = false;
                }

                const labelCorrecto = document.getElementById(`label-p${index}-o${item.respuestaCorrecta}`);
                labelCorrecto.classList.add('opcion-correcta');

                if (respondida && valorSeleccionado !== item.respuestaCorrecta) {
                    const labelIncorrecto = document.getElementById(`label-p${index}-o${valorSeleccionado}`);
                    labelIncorrecto.classList.add('opcion-incorrecta');
                }

                if (valorSeleccionado === item.respuestaCorrecta) {
                    aciertos++;
                }
            });

            if (!todasRespondidas) {
                alert("Hay preguntas sin responder, pero te calificaré lo que contestaste.");
            }

            const calificacion = (aciertos / preguntas.length) * 10;
            const textoFinal = document.getElementById('texto-calificacion');
            textoFinal.textContent = `Obtuviste ${aciertos} de ${preguntas.length} aciertos. Tu calificación es: ${calificacion.toFixed(1)}`;

            document.getElementById('btn-calificar').style.display = 'none';
            document.getElementById('zona-resultados').style.display = 'block';

            const bloques = Object.keys(baseDeDatos[examenActual]).map(Number);
            const maxBloque = Math.max(...bloques);

            const btnSiguiente = document.getElementById('btn-siguiente-bloque');
            if (bloqueActual >= maxBloque) {
                btnSiguiente.style.display = 'none';
            } else {
                btnSiguiente.style.display = 'inline-flex';
            }
        };

        const siguienteBloque = () => {
            const bloques = Object.keys(baseDeDatos[examenActual]).map(Number);
            const maxBloque = Math.max(...bloques);

            if (bloqueActual < maxBloque) {
                iniciarCuestionario(bloqueActual + 1);
            }
        };

        const actualizarProgreso = () => {
            const preguntas = baseDeDatos[examenActual][bloqueActual];
            const totalPreguntas = preguntas.length;
            let respondidas = 0;

            for (let i = 0; i < totalPreguntas; i++) {
                const opciones = document.getElementsByName(`pregunta${i}`);
                for (let radio of opciones) {
                    if (radio.checked) {
                        respondidas++;
                        break;
                    }
                }
            }

            const porcentaje = (respondidas / totalPreguntas) * 100;
            document.getElementById('barra-progreso').style.width = `${porcentaje}%`;
            document.getElementById('texto-progreso').textContent = `${respondidas} de ${totalPreguntas} respondidas`;
        };
    </script>
