<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identifica los Números - Aula Mágica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Nunito:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fdf4ff;
            background-image: radial-gradient(#fbcfe8 2px, transparent 2px);
            background-size: 30px 30px;
            overflow-x: hidden;
            max-width: 100vw;
        }

        h1, h2, h3, .comic-font {
            font-family: 'Comic Neue', cursive;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-animation { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .bounce-animation { animation: bounce 1s infinite; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .shake-animation { animation: shake 0.3s; }

        /* Imágenes en PNG */
        .fruit-icon {
            opacity: 0; 
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transition: all 0.2s ease;
        }
        
        .fruit-counted {
            opacity: 0.4 !important;
            transform: scale(0.85) !important;
            filter: grayscale(50%);
            pointer-events: none;
        }

        /* Botones de Números */
        .number-btn {
            transition: all 0.2s ease;
        }
        .number-btn:hover { transform: scale(1.05); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .number-btn:active { transform: scale(0.95); }
        .number-btn:disabled { pointer-events: none; }

        .correct-answer { background-color: #22c55e !important; color: white !important; transform: scale(1.1); z-index: 10; border-color: #16a34a !important; }
        .wrong-answer { background-color: #ef4444 !important; color: white !important; animation: shake 0.4s; border-color: #dc2626 !important; }

        .hidden-view { display: none !important; }
        .confetti { position: fixed; width: 10px; height: 10px; opacity: 0; z-index: 1000; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 sm:p-6">

    <!-- Barra Superior -->
    <div class="w-full max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4 mb-4">
        
        <!-- Contenedor para botones de regreso (se alternan mediante JS) -->
        <div class="flex items-center self-start sm:self-center">
            <!-- Botón para regresar al inicio de Aula Mágica (Visible en Menú) -->
            <a href="../matematicas.html" id="btnBackToAula" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-4 rounded-full shadow-md flex items-center gap-2 transition text-sm sm:text-base">
                <span>⬅️</span> Regresar a Aula Mágica
            </a>

            <!-- Botón para regresar a elegir nivel (Visible dentro del juego) -->
            <button onclick="goToMenu()" id="btnBackToLevels" class="hidden-view bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-full shadow-md flex items-center gap-2 transition text-sm sm:text-base">
                <span>⬅️</span> Elegir Nivel
            </button>
        </div>

        <!-- Marcador de Progreso -->
        <div id="scoreBoard" class="hidden-view bg-white px-4 py-2 sm:px-6 rounded-full shadow-md border-4 border-yellow-300 flex items-center gap-3">
            <span class="text-lg sm:text-xl font-bold text-gray-700 font-['Comic_Neue']">Avance: <span id="roundText" class="text-blue-600">1</span>/<span id="totalRoundsText">10</span></span>
            <div class="w-px h-6 bg-gray-300 mx-1"></div>
            <span class="text-lg sm:text-xl font-bold text-green-600 font-['Comic_Neue']">✅ <span id="correctText">0</span></span>
            <span class="text-lg sm:text-xl font-bold text-red-500 font-['Comic_Neue'] ml-2">❌ <span id="incorrectText">0</span></span>
        </div>
    </div>

    <!-- ================= PANTALLA DE SELECCIÓN DE NIVEL ================= -->
    <main id="levelScreen" class="w-full max-w-4xl mx-auto flex flex-col items-center justify-center flex-1">
        <h1 class="text-4xl sm:text-6xl text-purple-600 font-extrabold drop-shadow-md mb-8 font-['Comic_Neue'] text-center">¡Elige un Nivel!</h1>
        <div class="flex flex-col sm:flex-row gap-6 w-full justify-center px-4">
            <button onclick="startGame(10)" class="bg-green-400 hover:bg-green-500 text-white font-bold py-8 px-8 rounded-3xl shadow-lg border-b-8 border-green-600 transform transition hover:-translate-y-2 text-3xl w-full sm:w-1/2 flex flex-col items-center">
                <span>Nivel 1</span>
                <span class="text-xl font-normal mt-2">Hasta el 10</span>
            </button>
            <button onclick="startGame(20)" class="bg-blue-400 hover:bg-blue-500 text-white font-bold py-8 px-8 rounded-3xl shadow-lg border-b-8 border-blue-600 transform transition hover:-translate-y-2 text-3xl w-full sm:w-1/2 flex flex-col items-center">
                <span>Nivel 2</span>
                <span class="text-xl font-normal mt-2">Hasta el 20</span>
            </button>
        </div>
    </main>

    <!-- ================= ZONA DE JUEGO ================= -->
    <main id="gameScreen" class="w-full max-w-5xl mx-auto flex flex-col items-center flex-1 hidden-view">
        
        <header class="text-center mb-6 w-full">
            <button onclick="speakInstruction()" class="bg-yellow-100 hover:bg-yellow-200 border-2 border-yellow-400 text-gray-700 px-6 py-3 rounded-full shadow-sm text-lg sm:text-2xl font-bold flex items-center justify-center gap-3 mx-auto transition-transform active:scale-95">
                <span>🔊</span> Cuenta y elige el número correcto
            </button>
        </header>

        <!-- Contenedor de Dibujos -->
        <div class="w-full max-w-3xl bg-white rounded-3xl p-6 sm:p-8 shadow-xl border-4 border-pink-300 mb-8 relative min-h-[200px] flex flex-col items-center justify-center transition-colors duration-500" id="fruitBox">
            <div id="fruitsContainer" class="flex flex-wrap justify-center items-center gap-2 sm:gap-4">
                <!-- Imágenes generadas por JS -->
            </div>
            <p id="countHint" class="absolute bottom-2 text-xs sm:text-sm text-gray-500 font-bold opacity-0 transition-opacity">👆 ¡Toca los dibujos para contarlos!</p>
        </div>

        <!-- Teclado de Números -->
        <div class="w-full max-w-4xl bg-blue-50 p-4 sm:p-6 rounded-3xl border-4 border-blue-200">
            <div class="grid grid-cols-5 gap-2 sm:gap-4" id="numbersGrid">
                <!-- Botones generados por JS -->
            </div>
        </div>

    </main>

    <!-- ================= PANTALLA FINAL ================= -->
    <div id="endScreen" class="w-full max-w-3xl mx-auto flex flex-col items-center justify-center flex-1 hidden-view">
        <div class="bg-white rounded-3xl p-8 sm:p-12 shadow-2xl border-8 border-yellow-400 text-center relative overflow-hidden w-full">
            <div class="text-7xl sm:text-9xl mb-4 bounce-animation">🏆</div>
            <h1 class="text-4xl sm:text-6xl text-purple-600 font-extrabold drop-shadow-md mb-4 font-['Comic_Neue']">¡Terminaste!</h1>
            
            <div class="flex justify-center items-center gap-8 mb-6">
                <p class="text-2xl sm:text-4xl text-gray-700 font-bold flex flex-col items-center">
                    <span class="text-green-500 font-black text-5xl sm:text-6xl">✅ <span id="finalCorrect">0</span></span>
                    Buenas
                </p>
                <p class="text-2xl sm:text-4xl text-gray-700 font-bold flex flex-col items-center">
                    <span class="text-red-500 font-black text-5xl sm:text-6xl">❌ <span id="finalIncorrect">0</span></span>
                    Malas
                </p>
            </div>
            
            <p id="endMessage" class="text-xl sm:text-3xl text-blue-500 font-bold mb-8 font-['Comic_Neue']">
                ¡Gran esfuerzo!
            </p>

            <button onclick="goToMenu()" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-4 px-8 sm:px-12 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 text-2xl flex items-center justify-center gap-3 mx-auto border-4 border-indigo-300">
                <span>🏠</span> Volver a elegir nivel
            </button>
        </div>
    </div>

    <script>
        // --- VARIABLES DE ESTADO ---
        let bag = [];
        let maxRounds = 10;
        let currentRound = 0;
        let correctCount = 0;
        let incorrectCount = 0;
        let currentTargetNumber = 0;
        let countedFruits = 0;
        let isWaitingForNextRound = false;

        const bgColors = ['bg-red-50', 'bg-blue-50', 'bg-green-50', 'bg-yellow-50', 'bg-purple-50', 'bg-pink-50', 'bg-orange-50'];

        // Elementos DOM
        const levelScreen = document.getElementById('levelScreen');
        const gameScreen = document.getElementById('gameScreen');
        const endScreen = document.getElementById('endScreen');
        const scoreBoard = document.getElementById('scoreBoard');
        const fruitsContainer = document.getElementById('fruitsContainer');
        const fruitBox = document.getElementById('fruitBox');
        const numbersGrid = document.getElementById('numbersGrid');
        const roundText = document.getElementById('roundText');
        const totalRoundsText = document.getElementById('totalRoundsText');
        const correctText = document.getElementById('correctText');
        const incorrectText = document.getElementById('incorrectText');
        const countHint = document.getElementById('countHint');
        const btnBackToAula = document.getElementById('btnBackToAula');
        const btnBackToLevels = document.getElementById('btnBackToLevels');

        // --- SÍNTESIS DE VOZ ---
        const synth = window.speechSynthesis;
        let spanishVoice = null;

        function initVoice() {
            const voices = synth.getVoices();
            spanishVoice = voices.find(voice => voice.lang.includes('es-MX')) || 
                           voices.find(voice => voice.lang.includes('es-ES')) ||
                           voices.find(voice => voice.lang.includes('es'));
        }
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = initVoice;
        } else {
            initVoice();
        }

        function speak(text) {
            synth.cancel(); 
            const utterThis = new SpeechSynthesisUtterance(text.toString());
            if (spanishVoice) utterThis.voice = spanishVoice;
            utterThis.pitch = 1.3; 
            utterThis.rate = 0.9;
            synth.speak(utterThis);
        }

        function speakInstruction() {
            speak("Cuenta los dibujos y elige el número.");
        }

        // --- LÓGICA DEL JUEGO ---
        
        function goToMenu() {
            // Ocultar zonas de juego y resultados
            endScreen.classList.add('hidden-view');
            gameScreen.classList.add('hidden-view');
            scoreBoard.classList.add('hidden-view');
            scoreBoard.classList.remove('flex');
            
            // Mostrar la selección de nivel
            levelScreen.classList.remove('hidden-view');

            // Ajustar los botones de regreso
            btnBackToLevels.classList.add('hidden-view');
            btnBackToAula.classList.remove('hidden-view');
        }

        function startGame(limit) {
            maxRounds = limit;
            
            // Llenar la bolsa del 1 al límite y revolverla
            bag = Array.from({length: maxRounds}, (_, i) => i + 1);
            bag.sort(() => Math.random() - 0.5); 
            
            currentRound = 0;
            correctCount = 0;
            incorrectCount = 0;
            
            totalRoundsText.textContent = maxRounds;
            updateScoreBoard();
            buildNumbersGrid();
            
            // Ajustar visibilidad de las pantallas
            levelScreen.classList.add('hidden-view');
            endScreen.classList.add('hidden-view');
            gameScreen.classList.remove('hidden-view');
            scoreBoard.classList.remove('hidden-view');
            scoreBoard.classList.add('flex');

            // Ajustar los botones de regreso
            btnBackToAula.classList.add('hidden-view');
            btnBackToLevels.classList.remove('hidden-view');

            nextRound();
        }

        function buildNumbersGrid() {
            numbersGrid.innerHTML = '';
            for (let i = 1; i <= maxRounds; i++) {
                const btn = document.createElement('button');
                btn.className = `number-btn bg-white border-4 border-blue-300 text-blue-600 font-black text-2xl sm:text-4xl py-2 sm:py-4 rounded-xl sm:rounded-2xl shadow-sm font-['Comic_Neue'] flex items-center justify-center`;
                btn.textContent = i;
                btn.id = `btn-num-${i}`;
                btn.onclick = () => checkAnswer(i);
                numbersGrid.appendChild(btn);
            }
        }

        function nextRound() {
            if (currentRound >= maxRounds) {
                showEndScreen();
                return;
            }

            isWaitingForNextRound = false;
            currentRound++;
            updateScoreBoard();
            
            currentTargetNumber = bag.pop();
            countedFruits = 0;

            renderFruits(currentTargetNumber);
            
            for (let i = 1; i <= maxRounds; i++) {
                const btn = document.getElementById(`btn-num-${i}`);
                if (btn) {
                    btn.className = `number-btn bg-white border-4 border-blue-300 text-blue-600 font-black text-2xl sm:text-4xl py-2 sm:py-4 rounded-xl sm:rounded-2xl shadow-sm font-['Comic_Neue'] flex items-center justify-center`;
                    btn.disabled = false;
                }
            }

            setTimeout(() => {
                countHint.style.opacity = '1';
                speakInstruction();
            }, 500);
        }

        function renderFruits(num) {
            fruitsContainer.innerHTML = '';
            
            // Variar el color de fondo en cada ronda
            const randomBg = bgColors[num % bgColors.length];
            fruitBox.className = `w-full max-w-3xl ${randomBg} rounded-3xl p-6 sm:p-8 shadow-xl border-4 border-pink-300 mb-8 relative min-h-[200px] flex flex-col items-center justify-center transition-colors duration-500`;

            for (let i = 0; i < num; i++) {
                const img = document.createElement('img');
                // Se busca la imagen PNG por el número objetivo (1.png a 20.png).
                img.src = `frutas/${num}.png`; 
                img.alt = `Dibujo ${num}`;
                // Ajustamos el tamaño para que quepan hasta 20 imágenes
                img.className = 'fruit-icon w-12 h-12 sm:w-20 sm:h-20 drop-shadow-md cursor-pointer transform hover:scale-110 object-contain m-1 sm:m-2';
                img.style.animationDelay = `${i * 0.05}s`;
                
                img.onclick = function() {
                    if (this.classList.contains('fruit-counted') || isWaitingForNextRound) return;
                    
                    countedFruits++;
                    speak(countedFruits);
                    
                    this.classList.add('fruit-counted');
                    
                    if (countedFruits === currentTargetNumber) {
                        countHint.style.opacity = '0';
                        setTimeout(() => speak(`¡Son ${currentTargetNumber}! Ahora elige el número.`), 1000);
                    }
                };
                
                fruitsContainer.appendChild(img);
            }
        }

        function checkAnswer(selectedNumber) {
            if (isWaitingForNextRound) return;
            isWaitingForNextRound = true; 

            const selectedBtn = document.getElementById(`btn-num-${selectedNumber}`);
            const correctBtn = document.getElementById(`btn-num-${currentTargetNumber}`);

            countHint.style.opacity = '0';

            for (let i = 1; i <= maxRounds; i++) {
                document.getElementById(`btn-num-${i}`).disabled = true;
            }

            if (selectedNumber === currentTargetNumber) {
                correctCount++;
                selectedBtn.classList.add('correct-answer');
                createConfetti(30);
                speak(`¡Muy bien! Es el número ${currentTargetNumber}`);
            } else {
                incorrectCount++;
                selectedBtn.classList.add('wrong-answer');
                correctBtn.classList.add('correct-answer'); 
                speak(`¡Casi! Era el número ${currentTargetNumber}`);
            }

            updateScoreBoard();

            setTimeout(() => {
                nextRound();
            }, 2500);
        }

        function updateScoreBoard() {
            roundText.textContent = currentRound;
            correctText.textContent = correctCount;
            incorrectText.textContent = incorrectCount;
        }

        function showEndScreen() {
            gameScreen.classList.add('hidden-view');
            scoreBoard.classList.add('hidden-view');
            scoreBoard.classList.remove('flex');
            
            // Ocultar botón de regresar nivel en la pantalla final
            btnBackToLevels.classList.add('hidden-view');
            btnBackToAula.classList.add('hidden-view');
            
            endScreen.classList.remove('hidden-view');
            endScreen.classList.add('flex');
            
            document.getElementById('finalCorrect').textContent = correctCount;
            document.getElementById('finalIncorrect').textContent = incorrectCount;

            let endMsg = document.getElementById('endMessage');
            
            // Premiar si sacó todas correctas sin errores
            if (correctCount === maxRounds) {
                endMsg.textContent = "¡Perfecto! Eres un genio de las matemáticas. 🌟";
                speak(`¡Felicidades! Lograste todas correctas. ¡Eres súper inteligente!`);
                createConfetti(150); 
            } else if (correctCount >= (maxRounds * 0.7)) {
                endMsg.textContent = "¡Muy buen trabajo! Lo hiciste genial. 👍";
                speak(`Muy buen trabajo. Tuviste ${correctCount} buenas.`);
                createConfetti(50);
            } else {
                endMsg.textContent = "¡Sigue practicando, vas muy bien! 💪";
                speak(`Obtuviste ${correctCount} buenas. ¡Sigue practicando!`);
            }
        }

        // --- EFECTOS VISUALES ---
        function createConfetti(amount = 50) {
            const colors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#a855f7', '#ec4899'];
            for (let i = 0; i < amount; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti rounded-full pointer-events-none';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                const startX = window.innerWidth / 2;
                const startY = window.innerHeight / 2;
                
                const tx = (Math.random() - 0.5) * 600; 
                const ty = (Math.random() - 0.5) * 600; 
                
                confetti.style.left = startX + 'px';
                confetti.style.top = startY + 'px';
                
                const animation = confetti.animate([
                    { transform: `translate(0,0) rotate(0deg) scale(1)`, opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) rotate(${Math.random() * 360}deg) scale(0)`, opacity: 0 }
                ], {
                    duration: 1000 + Math.random() * 1000,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                });
                
                document.body.appendChild(confetti);
                animation.onfinish = () => confetti.remove();
            }
        }
    </script>
</body>
</html>
