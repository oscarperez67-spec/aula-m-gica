<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secuencias - Aula Mágica</title>
    <style>
        /* ================= ESTILOS GENERALES ================= */
        :root {
            --color-fondo: #f0f8ff;
            --color-primario: #FF6B6B;
            --color-secundario: #4ECDC4;
            --color-texto: #2d3436;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: var(--color-fondo); color: var(--color-texto);
            text-align: center; user-select: none;
        }

        header {
            background-color: var(--color-primario);
            padding: 15px 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-regresar {
            background-color: white; color: var(--color-primario); border: none;
            padding: 10px 20px; font-size: 18px; font-weight: bold;
            border-radius: 25px; cursor: pointer; text-decoration: none;
            display: inline-block; box-shadow: 0 4px 0px #d63031;
        }
        .btn-regresar:active { transform: translateY(4px); box-shadow: none; }

        #pantalla-inicio, #pantalla-juego, #pantalla-resultados {
            padding: 10px 20px; max-width: 600px; margin: 0 auto;
        }

        h1 { color: var(--color-primario); font-size: 2.2rem; margin-bottom: 10px; }
        
        .btn-nivel {
            display: block; width: 100%; margin: 15px 0; padding: 15px;
            font-size: 1.2rem; font-weight: bold; border: none; border-radius: 15px;
            cursor: pointer; transition: transform 0.2s; box-shadow: 0 5px 0px rgba(0,0,0,0.2);
        }
        .btn-nivel:active { transform: translateY(5px); box-shadow: none; }
        .nivel-1 { background-color: #A8E6CF; }
        .nivel-2 { background-color: #FFD3B6; }
        .nivel-3 { background-color: #FFAAA5; color: white; }

        .btn-jugar {
            background-color: #f1c40f; color: #2d3436;
            display: block; width: 100%; margin: 25px 0 10px 0; padding: 20px;
            font-size: 1.4rem; font-weight: bold; border: none; border-radius: 15px;
            cursor: pointer; transition: transform 0.2s; box-shadow: 0 5px 0px #e67e22;
        }
        .btn-jugar:active { transform: translateY(5px); box-shadow: none; }

        /* ================= INTERFAZ DE JUEGO ================= */
        #cabecera-juego {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px;
        }

        #marcador, #etiqueta-nivel {
            background-color: white; padding: 5px 15px; border-radius: 20px;
            font-weight: bold; font-size: 1.1rem; border: 2px solid;
        }
        #marcador { color: var(--color-secundario); border-color: var(--color-secundario); }
        #etiqueta-nivel { color: var(--color-primario); border-color: var(--color-primario); }

        .secuencia-container {
            display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px;
            background: white; padding: 15px; border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 5px; min-height: 80px;
        }

        .figura-secuencia { width: 55px; height: 55px; object-fit: contain; }

        .caja-vacia {
            width: 55px; height: 55px; border: 3px dashed #b2bec3; border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            font-size: 2rem; color: #b2bec3; background-color: #f5f6fa;
        }

        h3.pregunta-texto { margin-top: 5px; margin-bottom: 10px; font-size: 1.3rem; }

        .opciones-container {
            display: flex; justify-content: space-around; gap: 10px; margin-bottom: 15px;
        }

        .btn-opcion {
            background-color: white; border: 4px solid var(--color-secundario);
            border-radius: 20px; padding: 10px; cursor: pointer;
            box-shadow: 0 5px 0px #1dd1a1; transition: all 0.3s ease;
        }
        .btn-opcion:active:not(:disabled) { transform: translateY(5px); box-shadow: none; }
        .btn-opcion img { width: 65px; height: 65px; object-fit: contain; pointer-events: none; }
        
        .btn-opcion:disabled { cursor: not-allowed; }

        /* ================= ANIMACIONES ================= */
        #mensaje-feedback { font-size: 1.4rem; font-weight: bold; height: 35px; margin-bottom: 5px; }
        .exito { color: #27ae60; }
        .error { color: #e74c3c; animation: vibrar 0.3s ease; }

        .animacion-correcto {
            transform: scale(1.15) translateY(-5px) !important;
            border-color: #27ae60 !important; background-color: #e8f8f5 !important;
            box-shadow: 0 0 15px #2ed573 !important; z-index: 10;
        }

        @keyframes vibrar { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

        /* ================= RESULTADOS ================= */
        .calificacion-final {
            font-size: 4rem; color: #f1c40f; text-shadow: 2px 2px 0px #e67e22; margin: 10px 0;
        }
    </style>
</head>
<body>

    <header>
        <a href="../lenguaje.html" class="btn-regresar">⬅ Regresar a Aula Mágica</a>
    </header>

    <main>
        <div id="pantalla-inicio">
            <h1>¡Sigue la Serie!</h1>
            <p>Elige cómo quieres jugar hoy:</p>
            <button class="btn-nivel nivel-1" onclick="iniciarJuego(1)">Nivel Fácil (2 figuras)</button>
            <button class="btn-nivel nivel-2" onclick="iniciarJuego(2)">Nivel Intermedio (3 figuras)</button>
            <button class="btn-nivel nivel-3" onclick="iniciarJuego(3)">Nivel Difícil (4 figuras)</button>
            
            <hr style="border: 1px dashed #b2bec3; margin: 20px 0;">
            
            <button class="btn-jugar" onclick="iniciarJuego('reto')">¡Jugar Modo Reto! 🚀<br><span style="font-size: 0.9rem; font-weight: normal;">(Acierta 3 seguidas sin errores para subir de nivel)</span></button>
        </div>

        <div id="pantalla-juego" style="display: none;">
            <div id="cabecera-juego">
                <div id="marcador">Pregunta 1/10</div>
                <div id="etiqueta-nivel">Nivel Fácil</div>
            </div>
            
            <div id="secuencia-container" class="secuencia-container"></div>
            
            <h3 class="pregunta-texto">¿Qué figura sigue?</h3>
            <div id="opciones-container" class="opciones-container"></div>
            <div id="mensaje-feedback"></div>

            <button class="btn-nivel" style="background-color: #dfe6e9; padding: 10px; width: auto; margin: 0 auto; display: block;" onclick="mostrarInicio()">Abandonar Juego</button>
        </div>

        <div id="pantalla-resultados" style="display: none;">
            <h1>¡Terminaste!</h1>
            <h2>Tu calificación es:</h2>
            <div id="calificacion" class="calificacion-final">10</div>
            <p id="mensaje-final" style="font-size: 1.2rem; font-weight: bold;"></p>
            <button class="btn-jugar" onclick="mostrarInicio()" style="margin-top: 20px;">Jugar Otra Vez</button>
        </div>
    </main>

    <script>

        /* ================= BASE DE DATOS ================= */
        const bancoFiguras = {
            animales: [
                "perro", "gato", "oso", "conejo", "pajaro", "pez", "rana", "leon", 
                "elefante", "mono", "vaca", "cerdo", "pato", "tortuga", "jirafa", 
                "cebra", "hipopotamo", "tigre", "oveja", "caballo"
            ],
            figuras_geometricas: [
                "circulo_rojo", "circulo_azul", "cuadrado_rojo", "circulo_amarillo", "circulo_verde", "cuadrado_azul", "cuadrado_amarillo", "triangulo_rojo", "triangulo_azul", "triangulo_amarillo", "triangulo_verde", "estrella_amarilla", "estrella_azul", "corazon_rojo", "corazon_rosa", "rombo_naranja", "ovalo_morado", "cruz_roja", "luna_amarilla"
            ],
            frutas: [
                "manzana_roja", "manzana_verde", "platano", "fresa", "uva", "naranja", "limon", "sandia", "piña", "pera", "durazno", "cereza", "zanahoria", "tomate", "elote", "galleta", "pastel", "helado", "dona", "pizza"
            ],
	   naturaleza: [
		"caracol", "abeja", "mariposa", "palmera", "cactus", "montana", "fuego", "flor_roja", "flor_amarilla", "flor_rosa", "arbol", "hoja_verde", "hoja_cafe", "gota", "nieve", "arcoiris", "rayo", "lluvia", "nube", "sol"
	   ],
	   cosas:  [
		"regalo", "reloj", "campana", "globo_azul", "globo_rojo", "pelota", "tijeras", "cohete", "barco", "bicicleta", "lapiz",
"pincel", "regla", "libro", "mochila", "avion", "tren", "camion", "carro_azul", "carro_rojo"
	   ]
        };

        /* ================= VARIABLES DEL JUEGO ================= */
        let nivelActual = 1;
        let modoReto = false;
        let respuestaCorrecta = "";
        const carpetaImagenes = "figuras/"; 
        const formatoImagen = ".png";

        const TOTAL_PREGUNTAS = 10;
        let preguntaActual = 1;
        let aciertos = 0;
        let intentosPregunta = 0;
        let rachaPerfecta = 0; // NUEVO: Lleva el conteo para subir de nivel en Modo Reto

        function obtenerAleatorios(array, cantidad) {
            let mezclado = [...array].sort(() => 0.5 - Math.random());
            return mezclado.slice(0, cantidad);
        }

        function mostrarInicio() {
            document.getElementById('pantalla-inicio').style.display = 'block';
            document.getElementById('pantalla-juego').style.display = 'none';
            document.getElementById('pantalla-resultados').style.display = 'none';
        }

        function iniciarJuego(seleccion) {
            preguntaActual = 1;
            aciertos = 0;
            rachaPerfecta = 0; // Reiniciamos la racha
            
            if (seleccion === 'reto') {
                modoReto = true;
                nivelActual = 1; // El modo reto siempre empieza en fácil
            } else {
                modoReto = false;
                nivelActual = seleccion;
            }

            document.getElementById('pantalla-inicio').style.display = 'none';
            document.getElementById('pantalla-juego').style.display = 'block';
            generarNivel();
        }

        function generarNivel() {
            if (preguntaActual > TOTAL_PREGUNTAS) {
                mostrarResultados();
                return;
            }

            intentosPregunta = 0; 
            document.getElementById('marcador').innerText = `Pregunta ${preguntaActual}/${TOTAL_PREGUNTAS}`;
            
            // Definir nivel visual 
            let textoNivel = "";
            if (modoReto) {
                if (nivelActual === 1) { textoNivel = "Reto: Fácil ⭐"; }
                else if (nivelActual === 2) { textoNivel = "Reto: Medio ⭐⭐"; }
                else { textoNivel = "Reto: Difícil 🔥"; }
            } else {
                if (nivelActual === 1) { textoNivel = "Nivel Fácil ⭐"; }
                else if (nivelActual === 2) { textoNivel = "Nivel Medio ⭐⭐"; }
                else if (nivelActual === 3) { textoNivel = "Nivel Difícil 🔥"; }
            }
            document.getElementById('etiqueta-nivel').innerText = textoNivel;
            
            const secuenciaDiv = document.getElementById('secuencia-container');
            const opcionesDiv = document.getElementById('opciones-container');
            document.getElementById('mensaje-feedback').innerText = ''; 
            
            secuenciaDiv.innerHTML = ''; opcionesDiv.innerHTML = '';

            const nombresDeCategorias = Object.keys(bancoFiguras);
            const categoriaElegida = nombresDeCategorias[Math.floor(Math.random() * nombresDeCategorias.length)];
            const listaDeFiguras = bancoFiguras[categoriaElegida]; 

            let elementosPatron = [];
            let patronVisual = [];

            if (nivelActual === 1) { 
                elementosPatron = obtenerAleatorios(listaDeFiguras, 2); 
                patronVisual = [elementosPatron[0], elementosPatron[1], elementosPatron[0], elementosPatron[1], elementosPatron[0]];
                respuestaCorrecta = elementosPatron[1]; 
            } else if (nivelActual === 2) { 
                elementosPatron = obtenerAleatorios(listaDeFiguras, 3);
                patronVisual = [elementosPatron[0], elementosPatron[1], elementosPatron[2], elementosPatron[0], elementosPatron[1], elementosPatron[2], elementosPatron[0]];
                respuestaCorrecta = elementosPatron[1]; 
            } else if (nivelActual === 3) { 
                elementosPatron = obtenerAleatorios(listaDeFiguras, 4); 
                patronVisual = [elementosPatron[0], elementosPatron[1], elementosPatron[2], elementosPatron[3], elementosPatron[0], elementosPatron[1]];
                respuestaCorrecta = elementosPatron[2]; 
            }

            // Dibujar secuencia
            patronVisual.forEach(figura => {
                const img = document.createElement('img');
                img.src = carpetaImagenes + figura + formatoImagen;
                img.className = 'figura-secuencia';
                img.onerror = function() { this.style.display='none'; const d = document.createElement('div'); d.innerText=figura; d.style.fontSize="10px"; secuenciaDiv.appendChild(d); };
                secuenciaDiv.appendChild(img);
            });

            // Caja vacía
            const cajaVacia = document.createElement('div');
            cajaVacia.className = 'caja-vacia'; cajaVacia.innerText = "?";
            secuenciaDiv.appendChild(cajaVacia);

            // ================= LÓGICA DE DISTRACTORES =================
            let opciones = [respuestaCorrecta];
            
            let distractoresEnSecuencia = elementosPatron.filter(f => f !== respuestaCorrecta);
            distractoresEnSecuencia = obtenerAleatorios(distractoresEnSecuencia, 1);
            opciones.push(distractoresEnSecuencia[0]);

            let distractoresFueraSecuencia = listaDeFiguras.filter(f => !elementosPatron.includes(f));
            distractoresFueraSecuencia = obtenerAleatorios(distractoresFueraSecuencia, 1);
            opciones.push(distractoresFueraSecuencia[0]);

            opciones = obtenerAleatorios(opciones, 3);

            // Dibujar botones
            opciones.forEach(figura => {
                const btn = document.createElement('button');
                btn.className = 'btn-opcion';
                btn.onclick = function() { verificarRespuesta(figura, this); };

                const img = document.createElement('img');
                img.src = carpetaImagenes + figura + formatoImagen;
                img.onerror = function() { this.style.display='none'; btn.innerText=figura; };

                btn.appendChild(img);
                opcionesDiv.appendChild(btn);
            });
        }

        function verificarRespuesta(figuraSeleccionada, botonPresionado) {
            const mensajeDiv = document.getElementById('mensaje-feedback');
            
            if (figuraSeleccionada === respuestaCorrecta) {
                // ACIERTO
                botonPresionado.classList.add('animacion-correcto');
                mensajeDiv.innerText = "¡Excelente! 🌟";
                mensajeDiv.className = "exito";
                
                // Si atinó a la primera sin errores
                if (intentosPregunta === 0) { 
                    aciertos++; 
                    
                    // LÓGICA MODO RETO: Subir de nivel si logra 3 seguidas
                    if (modoReto) {
                        rachaPerfecta++;
                        if (rachaPerfecta === 3 && nivelActual < 3) {
                            nivelActual++;
                            rachaPerfecta = 0; // Reiniciamos la racha para el siguiente salto
                        }
                    }
                } 

                const botones = document.querySelectorAll('.btn-opcion');
                botones.forEach(b => b.disabled = true);

                setTimeout(() => {
                    preguntaActual++;
                    generarNivel();
                }, 1500);

            } else {
                // ERROR
                intentosPregunta++;
                
                // Si comete un error, la racha perfecta en modo reto se rompe
                if (modoReto) {
                    rachaPerfecta = 0;
                }
                
                botonPresionado.style.opacity = "0.5";
                botonPresionado.style.transform = "scale(0.9)";
                botonPresionado.style.boxShadow = "none";
                botonPresionado.disabled = true;

                if (intentosPregunta === 1) {
                    mensajeDiv.innerText = "¡Casi! Tienes otra oportunidad 🎈";
                    mensajeDiv.className = "error";
                    setTimeout(() => { mensajeDiv.className = ""; }, 300);
                } else {
                    mensajeDiv.innerText = "¡Vamos a la siguiente! 🚀";
                    mensajeDiv.className = "error";
                    
                    const botones = document.querySelectorAll('.btn-opcion');
                    botones.forEach(b => b.disabled = true);

                    setTimeout(() => {
                        preguntaActual++;
                        generarNivel();
                    }, 2000); 
                }
            }
        }

        function mostrarResultados() {
            document.getElementById('pantalla-juego').style.display = 'none';
            document.getElementById('pantalla-resultados').style.display = 'block';

            const califDiv = document.getElementById('calificacion');
            const mensajeFinal = document.getElementById('mensaje-final');
            
            califDiv.innerText = aciertos;

            if(aciertos === 10) {
                mensajeFinal.innerText = "¡Perfecto! Eres un genio.";
                califDiv.style.color = "#27ae60";
            } else if (aciertos >= 8) {
                mensajeFinal.innerText = "¡Muy bien hecho!";
                califDiv.style.color = "#f39c12";
            } else if (aciertos >= 6) {
                mensajeFinal.innerText = "¡Buen esfuerzo! Puedes mejorar.";
                califDiv.style.color = "#e67e22";
            } else {
                mensajeFinal.innerText = "¡Sigue practicando, tú puedes!";
                califDiv.style.color = "#e74c3c";
            }
        }
    </script>
</body>
</html>
