<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta de Sílabas - Aula Mágica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 2px, transparent 2px);
            background-size: 30px 30px;
            overflow-x: hidden;
            /* Evitar scroll horizontal en móviles */
            max-width: 100vw; 
        }

        h1, .syllable-display, .comic-font {
            font-family: 'Comic Neue', cursive;
        }

        .roulette-container {
            position: relative;
            /* Tamaños responsivos: más chico en celular, más grande en tablet/PC */
            width: 280px;
            height: 280px;
            margin: 0 auto;
        }
        @media (min-width: 640px) {
            .roulette-container {
                width: 350px;
                height: 350px;
            }
        }

        .roulette-wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
            background: conic-gradient(
                #ef4444 0deg 72deg,    /* Rojo */
                #f59e0b 72deg 144deg,  /* Naranja */
                #10b981 144deg 216deg, /* Verde */
                #3b82f6 216deg 288deg, /* Azul */
                #a855f7 288deg 360deg  /* Morado */
            );
        }

        .segment-text {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 15px;
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
            pointer-events: none;
        }
        @media (min-width: 640px) {
            .segment-text { font-size: 3.5rem; padding-top: 25px; }
        }

        /* Posicionar exactamente al centro de los 72 grados de cada porción */
        .t-0 { transform: rotate(36deg); }
        .t-1 { transform: rotate(108deg); }
        .t-2 { transform: rotate(180deg); }
        .t-3 { transform: rotate(252deg); }
        .t-4 { transform: rotate(324deg); }

        /* Marcador (dedo) arriba */
        .pointer {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 3rem;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
        }
        @media (min-width: 640px) { .pointer { font-size: 4rem; top: -40px; } }

        .spin-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 70px; height: 70px;
            background-color: white;
            border-radius: 50%;
            border: 4px solid #f472b6;
            z-index: 20;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #ec4899;
            font-size: 1.2rem;
            transition: transform 0.1s;
        }
        .spin-btn:active { transform: translate(-50%, -50%) scale(0.95); }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-animation { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .word-card { transition: all 0.2s ease; cursor: pointer; }
        .word-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .word-card:active { transform: scale(0.98); }

        .hidden-view { display: none !important; }
        .confetti { position: fixed; width: 10px; height: 10px; opacity: 0; z-index: 1000; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 sm:p-8">

    <!-- ================= VISTA 1: MENÚ PRINCIPAL ================= -->
    <div id="viewMenu" class="w-full max-w-5xl mx-auto flex flex-col items-center flex-1">
        
        <!-- Botón Volver a Aula Mágica -->
        <div class="w-full flex justify-start mb-4">
            <a href="../lenguaje.html" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-4 rounded-full shadow-md flex items-center gap-2 transition text-sm sm:text-base">
                <span>⬅️</span> Regresar a Aula Mágica
            </a>
        </div>

        <header class="text-center mb-8 sm:mb-12">
            <h1 class="text-4xl sm:text-6xl text-pink-500 font-extrabold drop-shadow-md mb-4">¡Ruleta de Sílabas!</h1>
            <p class="text-lg sm:text-2xl text-green-700 font-bold bg-white/80 inline-block px-6 py-3 rounded-full shadow-sm">
                Elige un grupo para jugar y aprender 🎲
            </p>
        </header>

        <!-- Cuadrícula de Letras -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 w-full max-w-4xl" id="menuGrid">
            <!-- Los botones se generarán con JavaScript -->
        </div>
    </div>

    <!-- ================= VISTA 2: RULETA Y JUEGO ================= -->
    <div id="viewGame" class="w-full max-w-6xl mx-auto flex-col items-center flex-1 hidden-view">
        
        <!-- Controles superiores -->
        <div class="w-full flex justify-between items-center mb-4 sm:mb-8">
            <button onclick="showMenu()" class="bg-orange-400 hover:bg-orange-500 text-white font-bold py-2 px-4 rounded-full shadow-md flex items-center gap-2 transition text-sm sm:text-base">
                <span>🔙</span> Cambiar Letra
            </button>
            <h2 id="gameTitle" class="comic-font text-2xl sm:text-4xl font-bold text-indigo-600 bg-white/80 px-6 py-2 rounded-2xl shadow-sm border-2 border-indigo-200">
                Letra R
            </h2>
        </div>

        <div class="w-full flex flex-col lg:flex-row items-center justify-center gap-8 lg:gap-16">
            
            <!-- La Ruleta -->
            <section class="flex flex-col items-center w-full lg:w-auto">
                <div class="roulette-container">
                    <div class="pointer">👇</div>
                    <div class="roulette-wheel" id="wheel">
                        <!-- Las letras se insertan por JS -->
                    </div>
                    <button class="spin-btn hover:bg-pink-50" id="spinBtn" onclick="spinWheel()">GIRAR</button>
                </div>
                <div id="statusMessage" class="mt-6 text-lg sm:text-xl text-gray-700 font-bold h-8 transition-opacity duration-300 text-center">
                    ¡Toca GIRAR para empezar!
                </div>
            </section>

            <!-- Resultados -->
            <section id="resultSection" class="hidden-view flex-col items-center w-full lg:w-1/2 bg-white rounded-3xl p-4 sm:p-6 shadow-xl border-4 border-yellow-300 relative overflow-hidden">
                <h2 class="text-xl sm:text-2xl text-gray-600 font-bold mb-2 text-center">¡Cayó en la sílaba!</h2>
                
                <!-- Sílaba Gigante -->
                <button onclick="speakCurrentSyllable()" class="syllable-display text-7xl sm:text-9xl font-black mb-4 sm:mb-6 cursor-pointer transform hover:scale-110 transition-transform active:scale-95 drop-shadow-lg" id="resultSyllable">
                    --
                </button>
                <p class="text-xs sm:text-sm text-gray-500 mb-6 font-bold bg-gray-100 px-3 py-1 rounded-full text-center">
                    👆 ¡Toca la sílaba para escucharla!
                </p>

                <!-- Palabras -->
                <div class="w-full">
                    <h3 class="text-lg sm:text-xl text-center text-blue-600 font-bold mb-4">Palabras con <span id="currentSyllableText">--</span>:</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 w-full" id="wordsContainer">
                        <!-- Tarjetas -->
                    </div>
                </div>

                <!-- Botón Jugar de Nuevo -->
                <button onclick="resetGame()" id="playAgainBtn" class="mt-8 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 sm:px-8 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 text-lg sm:text-xl flex items-center gap-2">
                    <span>🔄</span> ¡Jugar de nuevo!
                </button>
            </section>

        </div>
    </div>

    <script>
        // ================= BASE DE DATOS DE SÍLABAS (Tu Diccionario) =================
        // ¡Aquí es donde agregarás las otras 35 letras!
        const bibliotecaSilabas = {
            'R': {
                titulo: "Letra r (ra, re, ri, ro, ru)",
                colorBoton: "bg-red-400 hover:bg-red-500",
                silabas: ['ra', 're', 'ri', 'ro', 'ru'],
                datos: {
                    'ra': { color: 'text-red-500', words: [{ word: 'rana', icon: '🐸' }, { word: 'ratón', icon: '🐭' }, { word: 'rama', icon: '🌿' }] },
                    're': { color: 'text-yellow-500', words: [{ word: 'reloj', icon: '⌚' }, { word: 'regalo', icon: '🎁' }, { word: 'rey', icon: '👑' }] },
                    'ri': { color: 'text-green-500', words: [{ word: 'río', icon: '🌊' }, { word: 'risa', icon: '😂' }, { word: 'rico', icon: '😋' }] },
                    'ro': { color: 'text-blue-500', words: [{ word: 'rosa', icon: '🌹' }, { word: 'rojo', icon: '🔴' }, { word: 'ropa', icon: '👕' }] },
                    'ru': { color: 'text-purple-500', words: [{ word: 'rueda', icon: '🛞' }, { word: 'rubio', icon: '👱‍♂️' }, { word: 'ruido', icon: '🔊' }] }
                }
            },
            'M': {
                titulo: "Letra m (ma, me, mi, mo, mu)",
                colorBoton: "bg-pink-400 hover:bg-pink-500",
                silabas: ['ma', 'me', 'mi', 'mo', 'mu'],
                datos: {
                    'ma': { color: 'text-red-500', words: [{ word: 'mano', icon: '🖐️' }, { word: 'manzana', icon: '🍎' }, { word: 'mapa', icon: '🗺️' }] },
                    'me': { color: 'text-yellow-500', words: [{ word: 'mesa', icon: '🪑' }, { word: 'medusa', icon: '🪼' }, { word: 'melón', icon: '🍈' }] },
                    'mi': { color: 'text-green-500', words: [{ word: 'miel', icon: '🍯' }, { word: 'micrófono', icon: '🎤' }, { word: 'mimo', icon: '🎭' }] },
                    'mo': { color: 'text-blue-500', words: [{ word: 'mono', icon: '🐒' }, { word: 'moño', icon: '🎀' }, { word: 'momia', icon: '🤕' }] },
                    'mu': { color: 'text-purple-500', words: [{ word: 'muñeca', icon: '🎎' }, { word: 'murciélago', icon: '🦇' }, { word: 'muela', icon: '🦷' }] }
                }
            },
            'S': {
                titulo: "Letra s (sa, se, si, so, su)",
                colorBoton: "bg-blue-400 hover:bg-blue-500",
                silabas: ['sa', 'se', 'si', 'so', 'su'],
                datos: {
                    'sa': { color: 'text-red-500', words: [{ word: 'sapo', icon: '🐸' }, { word: 'sandía', icon: '🍉' }, { word: 'sal', icon: '🧂' }] },
                    'se': { color: 'text-yellow-500', words: [{ word: 'serpiente', icon: '🐍' }, { word: 'semilla', icon: '🌱' }, { word: 'semáforo', icon: '🚦' }] },
                    'si': { color: 'text-green-500', words: [{ word: 'silla', icon: '🪑' }, { word: 'sirena', icon: '🧜‍♀️' }, { word: 'siete', icon: '7️⃣' }] },
                    'so': { color: 'text-blue-500', words: [{ word: 'sol', icon: '☀️' }, { word: 'sopa', icon: '🥣' }, { word: 'sombrero', icon: '👒' }] },
                    'su': { color: 'text-purple-500', words: [{ word: 'suma', icon: '➕' }, { word: 'submarino', icon: '🛥️' }, { word: 'suéter', icon: '🧥' }] }
                }
            }
        };

        let currentLetterData = null;
        let currentRotation = 0;
        let isSpinning = false;
        let currentSyllable = '';

        // DOM Elements
        const viewMenu = document.getElementById('viewMenu');
        const viewGame = document.getElementById('viewGame');
        const menuGrid = document.getElementById('menuGrid');
        const wheel = document.getElementById('wheel');
        const gameTitle = document.getElementById('gameTitle');
        const resultSection = document.getElementById('resultSection');
        const resultSyllable = document.getElementById('resultSyllable');
        const wordsContainer = document.getElementById('wordsContainer');
        const statusMessage = document.getElementById('statusMessage');

        let audioCtx = null;

        function playTickSound() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            // Reanudar el audio context si está suspendido (políticas del navegador)
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            // Tipo 'triangle' da un sonido un poco más plástico/mecánico
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
            
            // Volumen bajo para que no abrume
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function startRouletteSound(duration) {
            let startTime = Date.now();
            let delay = 20; // Empieza muy rápido (20ms entre cada 'tac')
            
            function tick() {
                let elapsed = Date.now() - startTime;
                if (elapsed >= duration) return; // Se detiene cuando se acaba el tiempo
                
                playTickSound();
                
                // Hace que el 'tac' sea más lento exponencialmente al frenar
                let progress = elapsed / duration;
                delay = 20 + Math.pow(progress, 3) * 400; 
                
                setTimeout(tick, delay);
            }
            tick();
        }

        const synth = window.speechSynthesis;
        let spanishVoice = null;

        function initVoice() {
            const voices = synth.getVoices();
            spanishVoice = voices.find(voice => voice.lang.includes('es-MX')) || 
                           voices.find(voice => voice.lang.includes('es-ES')) ||
                           voices.find(voice => voice.lang.includes('es'));
        }
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = initVoice;
        } else {
            initVoice();
        }

        function speak(text) {
            synth.cancel(); 
            const utterThis = new SpeechSynthesisUtterance(text);
            if (spanishVoice) utterThis.voice = spanishVoice;
            utterThis.pitch = 1.2; 
            utterThis.rate = 0.9;
            synth.speak(utterThis);
        }

        function buildMenu() {
            menuGrid.innerHTML = '';
            for (const key in bibliotecaSilabas) {
                const item = bibliotecaSilabas[key];
                const btn = document.createElement('button');
                btn.className = `${item.colorBoton} text-white p-6 rounded-3xl shadow-lg transform transition hover:scale-105 active:scale-95 flex flex-col items-center justify-center border-4 border-white/50`;
                btn.onclick = () => showRoulette(key);
                btn.innerHTML = `
                    <span class="text-5xl font-black mb-2 font-['Comic_Neue']">${key}</span>
                    <span class="text-lg font-bold">${item.titulo}</span>
                `;
                menuGrid.appendChild(btn);
            }
        }

        function showMenu() {
            viewGame.classList.add('hidden-view');
            viewGame.classList.remove('flex');
            
            viewMenu.classList.remove('hidden-view');
            viewMenu.classList.add('flex');
            
            resetGame();
        }

        function showRoulette(letterKey) {
            currentLetterData = bibliotecaSilabas[letterKey];
            gameTitle.textContent = currentLetterData.titulo;
            
            // Construir las porciones de la ruleta
            wheel.innerHTML = '';
            currentLetterData.silabas.forEach((silaba, index) => {
                const div = document.createElement('div');
                div.className = `segment-text t-${index}`;
                div.textContent = silaba;
                wheel.appendChild(div);
            });

            // Cambiar vistas
            viewMenu.classList.add('hidden-view');
            viewMenu.classList.remove('flex');
            
            viewGame.classList.remove('hidden-view');
            viewGame.classList.add('flex');
            
            resetGame();
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;

            resultSection.classList.add('hidden-view');
            resultSection.classList.remove('flex');
            statusMessage.textContent = '¡Girando!...';
            statusMessage.style.opacity = '1';

            speak('¡A girar!');

            const extraSpins = (Math.floor(Math.random() * 4) + 3) * 360; 
            const randomAngle = Math.floor(Math.random() * 360);
            currentRotation += extraSpins + randomAngle;

            startRouletteSound(3000); // El sonido durará exactamente 3 segundos

            wheel.style.transform = `rotate(${currentRotation}deg)`;
            
            setTimeout(() => {
                isSpinning = false;
                const normalizedAngle = currentRotation % 360;
                
                // Con el marcador ARRIBA (0 grados)
                let pointerAngle = (360 - normalizedAngle) % 360;

                let winningIndex = 0;
                if (pointerAngle >= 0 && pointerAngle < 72) winningIndex = 0;       
                else if (pointerAngle >= 72 && pointerAngle < 144) winningIndex = 1;  
                else if (pointerAngle >= 144 && pointerAngle < 216) winningIndex = 2; 
                else if (pointerAngle >= 216 && pointerAngle < 288) winningIndex = 3; 
                else if (pointerAngle >= 288 && pointerAngle < 360) winningIndex = 4; 

                currentSyllable = currentLetterData.silabas[winningIndex];
                showResults(currentSyllable);
                createConfetti();

            }, 3000);
        }

        function showResults(syllable) {
            statusMessage.style.opacity = '0';
            const data = currentLetterData.datos[syllable];
            
            // Todo en minúscula para evitar confusiones
            const lowerSyllable = syllable.toLowerCase();

            resultSyllable.textContent = lowerSyllable;
            resultSyllable.className = `syllable-display text-7xl sm:text-9xl font-black mb-4 cursor-pointer transform hover:scale-110 transition-transform active:scale-95 drop-shadow-lg ${data.color}`;
            
            document.getElementById('currentSyllableText').textContent = lowerSyllable;

            wordsContainer.innerHTML = '';
            data.words.forEach((item, index) => {
                const wordCard = document.createElement('div');
                wordCard.className = 'word-card bg-white border-2 border-gray-100 rounded-2xl p-4 flex flex-col items-center justify-center shadow-md';
                wordCard.style.animationDelay = `${index * 0.15}s`;
                wordCard.classList.add('pop-animation');
                
                // Asegurarse de que la palabra leída esté en minúsculas para visualización
                const displayWord = item.word.toLowerCase();
                
                wordCard.onclick = () => speak(item.word);

                // Tamaño de emojis gigante para dispositivos
                wordCard.innerHTML = `
                    <div class="text-6xl sm:text-7xl md:text-8xl mb-3 drop-shadow-sm">${item.icon}</div>
                    <div class="text-xl sm:text-2xl font-black text-gray-700 font-['Comic_Neue']">${highlightSyllable(displayWord, lowerSyllable, data.color)}</div>
                `;
                wordsContainer.appendChild(wordCard);
            });

            setTimeout(() => {
                resultSection.classList.remove('hidden-view');
                resultSection.classList.add('flex');
                setTimeout(() => speakCurrentSyllable(), 300);
            }, 100);
        }

        function highlightSyllable(word, syllable, colorClass) {
            const regex = new RegExp(`(${syllable})`, 'gi');
            return word.replace(regex, `<span class="${colorClass} font-black">$1</span>`);
        }

        function speakCurrentSyllable() {
            if (currentSyllable) speak(currentSyllable);
        }

        function resetGame() {
            resultSection.classList.add('hidden-view');
            resultSection.classList.remove('flex');
            setTimeout(() => {
                statusMessage.textContent = '¡Toca GIRAR para otra sílaba!';
                statusMessage.style.opacity = '1';
                const btn = document.getElementById('spinBtn');
                btn.style.transform = 'translate(-50%, -50%) scale(1.1)';
                setTimeout(() => btn.style.transform = 'translate(-50%, -50%) scale(1)', 200);
            }, 300);
        }

        function createConfetti() {
            const colors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#a855f7'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti rounded-full pointer-events-none';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                const startX = window.innerWidth / 2;
                const startY = window.innerHeight / 2;
                
                const tx = (Math.random() - 0.5) * 600; 
                const ty = (Math.random() - 0.5) * 600; 
                
                confetti.style.left = startX + 'px';
                confetti.style.top = startY + 'px';
                
                const animation = confetti.animate([
                    { transform: `translate(0,0) rotate(0deg) scale(1)`, opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) rotate(${Math.random() * 360}deg) scale(0)`, opacity: 0 }
                ], {
                    duration: 1000 + Math.random() * 1000,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                });
                
                document.body.appendChild(confetti);
                animation.onfinish = () => confetti.remove();
            }
        }

        // Inicializar el menú al cargar la página
        window.onload = buildMenu;
    </script>
</body>
</html>
