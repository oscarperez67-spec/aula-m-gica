<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Comparar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Nunito', sans-serif;
            background-color: #dbeafe; /* blue-100 */
        }
        .kid-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden">

    <!-- Mensajes Flotantes (Toasts) -->
    <div id="toast" class="fixed top-20 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg z-50 transition-opacity duration-300 opacity-0 pointer-events-none hidden">
        Mensaje
    </div>

    <!-- Navegación Superior -->
    <div class="flex justify-between w-full p-4 absolute top-0 left-0 right-0 z-10">
        <button onclick="goToMenu()" class="flex items-center gap-2 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 px-4 py-2 rounded-full font-bold shadow-md transition-transform active:scale-95">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            <span class="hidden sm:inline">Menú</span>
        </button>
        <button onclick="goToAulaMagica()" class="flex items-center gap-2 bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-full font-bold shadow-md transition-transform active:scale-95">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span class="hidden sm:inline">Aula Mágica</span>
        </button>
    </div>

    <div class="w-full max-w-3xl px-4 py-16 flex flex-col items-center z-0 mt-8">
        
        <!-- PANTALLA DE CONFIGURACIÓN -->
        <div id="setup-screen" class="bg-white p-6 sm:p-8 rounded-3xl kid-shadow w-full text-center border-4 border-blue-400">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-blue-600 mb-6 drop-shadow-sm">
                ¡Aprende a Comparar!
            </h1>
            
            <div class="mb-6 text-left">
                <h2 class="text-xl font-bold text-gray-700 mb-3 text-center">¿Con qué quieres jugar?</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="ops-container">
                    <!-- Botones de operaciones se generan en JS -->
                </div>
            </div>

            <div class="mb-6 text-left">
                <h2 class="text-xl font-bold text-gray-700 mb-3 text-center">Nivel de Dificultad</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3" id="diff-container">
                    <!-- Botones de dificultad se generan en JS -->
                </div>
            </div>

            <div class="mb-8">
                <h2 class="text-xl font-bold text-gray-700 mb-3">¿Cuántas veces quieres jugar?</h2>
                <div class="flex flex-wrap justify-center gap-3" id="rounds-container">
                    <!-- Botones de rondas se generan en JS -->
                </div>
            </div>

            <button onclick="startGame()" class="bg-green-500 hover:bg-green-600 text-white text-2xl font-black py-4 px-10 rounded-full shadow-lg transform transition-all active:scale-95 hover:scale-105 animate-pulse">
                ¡COMENZAR!
            </button>
        </div>

        <!-- PANTALLA DE JUEGO -->
        <div id="playing-screen" class="w-full hidden">
            <!-- Header del juego -->
            <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-md mb-8 border-2 border-gray-200">
                <div class="text-xl font-bold text-blue-600" id="round-display">
                    Ronda 1 / 10
                </div>
                <div class="flex gap-4">
                    <div class="flex items-center gap-1 text-green-500 font-bold text-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        <span id="score-correct">0</span>
                    </div>
                    <div class="flex items-center gap-1 text-red-500 font-bold text-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        <span id="score-incorrect">0</span>
                    </div>
                </div>
            </div>

            <!-- Área de la pregunta -->
            <div class="bg-white p-6 sm:p-10 rounded-3xl shadow-xl border-4 border-blue-300 flex flex-col items-center">
                
                <div class="flex flex-col sm:flex-row w-full justify-between items-center gap-6 sm:gap-4 mb-10">
                    <!-- Izquierda -->
                    <div id="left-exp" class="bg-blue-100 text-blue-800 text-3xl sm:text-4xl font-black py-4 px-2 rounded-2xl w-full sm:w-2/5 text-center shadow-inner border-2 border-blue-200 flex items-center justify-center min-h-[100px] break-words">
                        10
                    </div>

                    <!-- Centro (Signo) -->
                    <div id="center-symbol" class="font-black text-5xl sm:text-6xl flex-shrink-0 transition-all duration-300 text-gray-400">
                        ?
                    </div>

                    <!-- Derecha -->
                    <div id="right-exp" class="bg-orange-100 text-orange-800 text-3xl sm:text-4xl font-black py-4 px-2 rounded-2xl w-full sm:w-2/5 text-center shadow-inner border-2 border-orange-200 flex items-center justify-center min-h-[100px] break-words">
                        5
                    </div>
                </div>

                <!-- Botones de respuesta -->
                <h3 class="text-xl font-bold text-gray-500 mb-4 text-center">¿Cuál símbolo va en medio?</h3>
                <div class="flex gap-3 sm:gap-6 justify-center w-full">
                    
                    <button onclick="handleAnswer('<')" id="btn-less" class="flex flex-col items-center justify-center w-28 h-28 sm:w-32 sm:h-32 rounded-2xl text-white shadow-lg transition-transform transform active:scale-90 hover:-translate-y-1 bg-pink-500 hover:bg-pink-600">
                        <span class="text-4xl sm:text-6xl font-black leading-none mb-1">&lt;</span>
                        <span class="text-sm sm:text-base font-bold text-center leading-tight">Menor que</span>
                    </button>

                    <button onclick="handleAnswer('=')" id="btn-equal" class="flex flex-col items-center justify-center w-28 h-28 sm:w-32 sm:h-32 rounded-2xl text-white shadow-lg transition-transform transform active:scale-90 hover:-translate-y-1 bg-purple-500 hover:bg-purple-600">
                        <span class="text-4xl sm:text-6xl font-black leading-none mb-1">=</span>
                        <span class="text-sm sm:text-base font-bold text-center leading-tight">Igual</span>
                    </button>

                    <button onclick="handleAnswer('>')" id="btn-greater" class="flex flex-col items-center justify-center w-28 h-28 sm:w-32 sm:h-32 rounded-2xl text-white shadow-lg transition-transform transform active:scale-90 hover:-translate-y-1 bg-teal-500 hover:bg-teal-600">
                        <span class="text-4xl sm:text-6xl font-black leading-none mb-1">&gt;</span>
                        <span class="text-sm sm:text-base font-bold text-center leading-tight">Mayor que</span>
                    </button>
                    
                </div>

                <!-- Mensaje de Retroalimentación -->
                <div id="feedback-msg" class="mt-8 h-16 flex items-center justify-center w-full rounded-xl transition-all opacity-0">
                    <!-- Contenido de feedback -->
                </div>
            </div>
        </div>

        <!-- PANTALLA DE RESULTADOS -->
        <div id="result-screen" class="bg-white p-8 rounded-3xl kid-shadow w-full text-center border-4 border-yellow-400 hidden">
            <svg class="w-24 h-24 text-yellow-500 mx-auto mb-4 animate-bounce" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
            <h1 class="text-4xl font-extrabold text-blue-600 mb-2">¡Juego Terminado!</h1>
            <p class="text-xl font-bold text-gray-600 mb-8">Aquí están tus resultados:</p>
            
            <div class="flex justify-center gap-8 mb-10">
                <div class="bg-green-100 border-4 border-green-400 p-6 rounded-2xl flex flex-col items-center min-w-[120px]">
                    <svg class="text-green-500 w-12 h-12 mb-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    <span class="text-green-700 font-bold text-lg">Buenas</span>
                    <span id="final-correct" class="text-4xl font-black text-green-600">0</span>
                </div>
                <div class="bg-red-100 border-4 border-red-400 p-6 rounded-2xl flex flex-col items-center min-w-[120px]">
                    <svg class="text-red-500 w-12 h-12 mb-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    <span class="text-red-700 font-bold text-lg">Malas</span>
                    <span id="final-incorrect" class="text-4xl font-black text-red-600">0</span>
                </div>
            </div>

            <button onclick="goToMenu()" class="flex items-center justify-center gap-3 bg-blue-500 hover:bg-blue-600 text-white text-xl font-bold py-4 px-8 rounded-full mx-auto shadow-lg transform transition-all active:scale-95 hover:scale-105">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 2v6h6"/></svg>
                Volver a jugar
            </button>
        </div>

    </div>

    <script>
        // CONFIGURACIÓN INICIAL
        const OPERATIONS = [
            { id: 'int', label: 'Enteros' },
            { id: 'add', label: 'Sumas (+)' },
            { id: 'sub', label: 'Restas (-)' },
            { id: 'mul', label: 'Multiplicación (×)' },
            { id: 'div', label: 'División (÷)' }
        ];

        const DIFFICULTY_OPTIONS = [
            { id: 'facil', label: 'Fácil (máx 20)', max: 20 },
            { id: 'medio', label: 'Medio (máx 100)', max: 100 },
            { id: 'dificil', label: 'Difícil (máx 1000)', max: 1000 }
        ];

        const ROUND_OPTIONS = [10, 20, 30, 40, 50];

        // VARIABLES DE ESTADO
        let selectedOps = ['int'];
        let selectedDifficulty = 'medio';
        let totalRounds = 10;
        let currentRound = 1;
        let score = { correct: 0, incorrect: 0 };
        let question = null;
        let isWaiting = false;

        // INICIALIZAR MENÚS
        function initMenus() {
            // Renderizar Operaciones
            const opsContainer = document.getElementById('ops-container');
            opsContainer.innerHTML = OPERATIONS.map(op => `
                <button onclick="toggleOp('${op.id}')" id="op-${op.id}" class="p-3 rounded-xl font-bold text-lg transition-all transform active:scale-95 border-2 ${selectedOps.includes(op.id) ? 'bg-green-400 border-green-500 text-white shadow-inner' : 'bg-gray-100 border-gray-300 text-gray-600 hover:bg-gray-200'}">
                    ${op.label}
                </button>
            `).join('');

            // Renderizar Dificultad
            const diffContainer = document.getElementById('diff-container');
            diffContainer.innerHTML = DIFFICULTY_OPTIONS.map(diff => `
                <button onclick="setDifficulty('${diff.id}')" id="diff-${diff.id}" class="p-3 rounded-xl font-bold text-lg transition-all transform active:scale-95 border-2 ${selectedDifficulty === diff.id ? 'bg-purple-500 border-purple-600 text-white shadow-inner scale-105' : 'bg-white border-purple-300 text-purple-600 hover:bg-purple-50'}">
                    ${diff.label}
                </button>
            `).join('');

            // Renderizar Rondas
            const roundsContainer = document.getElementById('rounds-container');
            roundsContainer.innerHTML = ROUND_OPTIONS.map(num => `
                <button onclick="setRounds(${num})" id="round-${num}" class="w-14 h-14 rounded-full font-bold text-xl transition-all transform active:scale-95 border-2 ${totalRounds === num ? 'bg-blue-500 border-blue-600 text-white scale-110 shadow-md' : 'bg-white border-blue-300 text-blue-500 hover:bg-blue-50'}">
                    ${num}
                </button>
            `).join('');
        }

        function toggleOp(id) {
            if (selectedOps.includes(id)) {
                selectedOps = selectedOps.filter(op => op !== id);
            } else {
                selectedOps.push(id);
            }
            initMenus();
        }

        function setDifficulty(id) {
            selectedDifficulty = id;
            initMenus();
        }

        function setRounds(num) {
            totalRounds = num;
            initMenus();
        }

        // MOSTRAR TOAST (Mensaje de error u aviso)
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 3000);
        }

        // NAVEGACIÓN
        function goToMenu() {
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('playing-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
        }

        function goToAulaMagica() {
            // *** AQUÍ PONES EL ENLACE REAL A TU AULA MÁGICA ***
            window.location.href = "../matematicas.html";
            showToast("Aquí redirigirá al Aula Mágica (cambiar enlace en código)");
        }

        // LÓGICA MATEMÁTICA
        function generateExpression(type, diffMax) {
            let text, value;
            switch (type) {
                case 'int':
                    value = Math.floor(Math.random() * diffMax) + 1;
                    text = value.toString();
                    break;
                case 'add':
                    const a1 = Math.floor(Math.random() * (diffMax - 1)) + 1;
                    const a2 = Math.floor(Math.random() * (diffMax - a1)) + 1;
                    value = a1 + a2;
                    text = `${a1} + ${a2}`;
                    break;
                case 'sub':
                    const s1 = Math.floor(Math.random() * (diffMax - 1)) + 2; 
                    const s2 = Math.floor(Math.random() * (s1 - 1)) + 1; 
                    value = s1 - s2;
                    text = `${s1} - ${s2}`;
                    break;
                case 'mul':
                    let maxFactor = diffMax === 20 ? 10 : diffMax === 100 ? 20 : 50;
                    const m1 = Math.floor(Math.random() * maxFactor) + 1;
                    const m2 = Math.floor(Math.random() * Math.floor(diffMax / m1)) + 1;
                    value = m1 * m2;
                    text = `${m1} × ${m2}`;
                    break;
                case 'div':
                    let maxDivisor = diffMax === 20 ? 10 : diffMax === 100 ? 20 : 50;
                    const divisor = Math.floor(Math.random() * maxDivisor) + 1;
                    const cociente = Math.floor(Math.random() * Math.floor(diffMax / divisor)) + 1;
                    const dividendo = divisor * cociente;
                    value = cociente;
                    text = `${dividendo} ÷ ${divisor}`;
                    break;
                default:
                    value = 1; text = '1';
            }
            return { text, value };
        }

        function generateQuestion() {
            const diffMax = DIFFICULTY_OPTIONS.find(d => d.id === selectedDifficulty).max;
            
            const typeLeft = selectedOps[Math.floor(Math.random() * selectedOps.length)];
            const typeRight = selectedOps[Math.floor(Math.random() * selectedOps.length)];

            const leftExp = generateExpression(typeLeft, diffMax);
            const rightExp = generateExpression(typeRight, diffMax);

            let correctSymbol = '=';
            if (leftExp.value > rightExp.value) correctSymbol = '>';
            if (leftExp.value < rightExp.value) correctSymbol = '<';

            question = {
                leftText: leftExp.text,
                rightText: rightExp.text,
                correctSymbol: correctSymbol
            };

            // Renderizar pregunta
            document.getElementById('left-exp').innerText = question.leftText;
            document.getElementById('right-exp').innerText = question.rightText;
            
            const center = document.getElementById('center-symbol');
            center.innerText = '?';
            center.className = 'font-black text-5xl sm:text-6xl flex-shrink-0 transition-all duration-300 text-gray-400 animate-pulse';

            document.getElementById('round-display').innerText = `Ronda ${currentRound} / ${totalRounds}`;
            document.getElementById('feedback-msg').className = 'mt-8 h-16 flex items-center justify-center w-full rounded-xl transition-all opacity-0';
            document.getElementById('feedback-msg').innerHTML = '';
            
            isWaiting = false;
            
            // Habilitar botones
            document.querySelectorAll('button[id^="btn-"]').forEach(btn => {
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            });
        }

        // FLUJO DEL JUEGO
        function startGame() {
            if (selectedOps.length === 0) {
                showToast("¡Selecciona al menos una operación!");
                return;
            }
            score = { correct: 0, incorrect: 0 };
            currentRound = 1;
            updateScoreDisplay();
            
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('playing-screen').classList.remove('hidden');
            
            generateQuestion();
        }

        function updateScoreDisplay() {
            document.getElementById('score-correct').innerText = score.correct;
            document.getElementById('score-incorrect').innerText = score.incorrect;
        }

        function handleAnswer(symbolSelected) {
            if (isWaiting) return;
            isWaiting = true;

            // Deshabilitar botones temporalmente
            document.querySelectorAll('button[id^="btn-"]').forEach(btn => {
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            });

            const isCorrect = symbolSelected === question.correctSymbol;
            const center = document.getElementById('center-symbol');
            const feedbackBox = document.getElementById('feedback-msg');

            center.innerText = symbolSelected;
            center.classList.remove('animate-pulse', 'text-gray-400');

            if (isCorrect) {
                score.correct++;
                center.classList.add('text-green-500', 'scale-125');
                feedbackBox.className = 'mt-8 h-16 flex items-center justify-center w-full rounded-xl transition-all bg-green-100 text-green-600 scale-110';
                feedbackBox.innerHTML = '<span class="text-2xl font-bold flex items-center gap-2"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> ¡Excelente!</span>';
            } else {
                score.incorrect++;
                center.classList.add('text-red-500', 'scale-125');
                feedbackBox.className = 'mt-8 h-16 flex items-center justify-center w-full rounded-xl transition-all bg-red-100 text-red-600 scale-110';
                feedbackBox.innerHTML = '<span class="text-2xl font-bold flex items-center gap-2"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> ¡Uy! Intenta en la siguiente</span>';
            }

            updateScoreDisplay();

            setTimeout(() => {
                if (currentRound < totalRounds) {
                    currentRound++;
                    generateQuestion();
                } else {
                    showResults();
                }
            }, 1800);
        }

        function showResults() {
            document.getElementById('playing-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-correct').innerText = score.correct;
            document.getElementById('final-incorrect').innerText = score.incorrect;
        }

        // Iniciar pantalla de configuración al cargar
        initMenus();

    </script>
</body>
</html>
